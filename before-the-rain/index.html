     "text": "她用额头轻轻碰了我一下。"

    {
     "speaker": "",
     "text": "有些关系不必靠一个吻结算。我们一起，替许多不完整的人生，留下了位置。"

     "text": "我把它收好，继续过自己的日子。"

     "text": "照片里的光永远停在最漂亮的一刻。林晚月的左手不再有伤，她的母亲每天都会来吃晚饭。"

 "turns": [
  {
   "name": "不是让谁回来",
   "line": "那东西没有要把死人带回来。它只是绕了很远，才找到一个愿意把最后一句话听完的人。",
   "clue": "真正的痕迹都有磨损。有人用过、等过，不是临时为我编出的诱惑。",
   "reply": "不把它变成奇迹，也可以认真对待。",
   "effect": "witness"
  },
  {
   "name": "复制得太完整",
   "line": "我们找到两份相同的东西。一份完美，一份有错误。钟房很有耐心，让完美的那份离我更近。",
   "clue": "旧物里有一个很笨的小错误。写错的字，缝歪的线，像活人没藏好的指纹。",
   "reply": "不是因为难看才是真的。是因为它从来不是为讨好现在的我而存在。",
   "effect": "discern"
  },
  {
   "name": "不再交换谁",
   "line": "钟房提出交换。想把东西送回去，就得留一个人的名字。它把这说得很公平，仿佛世界永远只能少一个人。",
   "clue": "边缘藏着一个被封住的小出口。不是更宏大的牺牲，只是一个从前被忽略的实际办法。",
   "reply": "先试另一条路。别急着把自己填进去。",
   "effect": "shared"
  },
  {
   "name": "字迹来自我",
   "line": "纸上的字迹属于从前的我。我不记得写过，却认得那一笔总会向左偏的小习惯。",
   "clue": "那句话没有要求我偿还。写字的人只说，今天先把饭吃完。",
   "reply": "过去的我，也许不是希望现在的我活成一块墓碑。",
   "effect": "forgive"
  },
  {
   "name": "她曾经来过",
   "line": "她比我更早认出了那件东西。原来在我不知道的时间里，她一个人来过这里很多次。",
   "clue": "她留下过一处极小的记号，不是求救。只是给下一次想来看看的人认路。",
   "reply": "这段不是等你来救的故事。不过，我愿意让你陪着。",
   "effect": "near"
  },
  {
   "name": "不把所有信给我",
   "line": "东西本来属于她过去认识的另一个人。我突然感到一点迟来的陌生：她的人生，当然不只围绕我发生。",
   "clue": "她把原来的姓名保留着，没有因为我在场，就装作那些在意从不曾存在。",
   "reply": "我可以有过去，也可以认真地站在现在。你也可以。",
   "effect": "respect"
  },
  {
   "name": "沉默仍是回答",
   "line": "那件东西失去了声音。钟房说沉默就等于没有意见，可我看见她的手在轻轻握紧。",
   "clue": "纸上有很浅的压痕。没有发出的声音，被用另一种方式认真写了下来。",
   "reply": "听不见，不代表没有人在说。",
   "effect": "listen"
  },
  {
   "name": "好意也有机关",
   "line": "来帮忙的人说得句句周到，像提前知道我们所有脆弱。只有他脚下，没有真正踩过雨水。",
   "clue": "脚印经过积水，却没有弄湿。善意被做成了一张太干净的脸。",
   "reply": "让我先问一句。他有没有给我们拒绝的地方？",
   "effect": "boundary"
  },
  {
   "name": "不是未来的命令",
   "line": "我们在里面看见一个更老的自己。未来像一张已经批改好的卷子，催人接受那个结局。",
   "clue": "那个人的一处习惯，和现在不同。它只是可能，不是从未来寄来的判决。",
   "reply": "提前看见，不等于必须走到那里。",
   "effect": "future"
  },
  {
   "name": "可以暂时没有答案",
   "line": "我们花了很久，仍然没能把缺掉的部分补全。钟房不断递来圆满的答案，每一个都比不知道容易接受。",
   "clue": "真正留下来的部分很短。它没有答完所有问题，却也没有骗我们。",
   "reply": "先把它留成这个样子。没说完，也不是白来一趟。",
   "effect": "unfinished"
  }
 ],

  N('c00','冲洗一张合照','darkroom','lin:0',`
|林晚月把我的辞职信垫在了摇晃的桌脚下面。
我|那是给你看的。
林晚月|看过了。纸不错。
|她蹲下来，又往桌脚里塞了一点。显影盘终于不再晃。我的去留，在这间暗房里暂时发挥了别的作用。
|雨敲着通风窗。九月的鹭川刚刚降温，旧毛衣还在箱底，我只好把工作服的袖口拉到指尖。
林晚月|想好了？
我|嗯。外地的工资高一些。
林晚月|房东昨天把账单送来了？
|我没回答。她也没继续拆穿。
|挂绳上晾着一排旧照片。老人给亡妻补一张证件照，女儿想看父亲年轻时的模样——我们的工作，多半是替别人的以后收拾从前。
|晚月以前是记者。离开报社以后，她把旧相机挂在这间暗房里，说至少照片修坏了还知道错在哪一笔。
|我在这里做了三个月学徒。林晚月从来不夸我，只会在修坏的地方贴一枚黄色便笺。
|今天有一枚贴在我的饭盒上：别再放到发酸。
林晚月|手套。
|她把自己的那副抛给我。我没接稳，橡胶指尖拍了一下额头。她偏过脸，肩膀很轻地动了一下。
我|想笑可以直接笑。
林晚月|没笑。通风不好，缺氧。
|暗房电话响了。她拿起话筒，听了两句，脸上的笑意收了起来。
林晚月|阿婆，我们六点关门……不是，不是说您不能来。
|我看了一眼墙上的钟，五点五十四。
|今晚公馆聚餐。唐瑶从上午开始就在群里提醒：谁再放鸽子，谁洗十一只碗。
|晚月捂住话筒，看向门外。雨正下得很大。
林晚月|她来取合照。丈夫住院了，说今晚一定得给他看看。
我|照片修好了？
|她把最后一只显影盘拉过来。原本空白的边缘，慢慢浮出一个人的轮廓。
|那是我的脸。
|照片角落的日期，却是三年前。
`,{next:'c01',mood:'warm',time:'照相馆 · 17:54'});
  N('c01','照片里的人','darkroom','lin:2',`
|我把盘子拉近了一点。照片里的我穿着从没见过的衬衫，站在一个老太太身后，笑得很傻。
我|这是什么时候拍的？
|晚月没有低头看。她还捂着话筒，指节白得有些过分。
林晚月|先把照片放下。药水别沾到手。
|电话那头，老人听不清我们在说什么，一遍遍问照片好了没有。
|我的第一反应并不是害怕。我想，是不是以前来过这里。是不是忘了某次临时帮忙，或某个不值得记住的下午。
|晚月把听筒递给我。她左手贴着一小块胶布，边缘卷起来，露出很旧的伤痕。

`,{time:'照相馆 · 17:58',mood:'warm',choices:[C('先把合照送过去。','photo_delivery',{delivered:true},{lin:2,shen:1}),C('留下来，把底片再洗一遍。','photo_negative',{negative:true},{gu:2,ye:1})]});
  N('photo_delivery','雨里的取件人','street','lin:0',`
|我把照片装进防水袋，又往袋口折了两道。晚月说她来送，我已经把伞拿了起来。
我|你留下关门。我认得医院。
林晚月|不是这家。
|我愣了一下。

|她从柜台后绕过来，把钥匙交给我。我们谁也没再提照片上的脸。
|旧医院的围栏外，一个头发全白的女人正用塑料袋护着保温桶。她看见我们，赶紧把袋子换到一只手上。
老人|真不好意思，让你们跑一趟。他今天胃口好，我就想着……
|她说到这里，忽然不知道该往哪里走了。围栏内是停工的楼，住院部只剩拆去半边的招牌。
|晚月没说医院早就不在这里了。她把照片递过去，站在老人挡不住雨的那一边。
老人|拍得真好。他本来不肯笑的，你们还逗他。
|她摸了摸照片上的丈夫。我的脸正一点点变淡，只有老人指尖经过的地方，还留着模糊的轮廓。
我|照片后面的名字，是谁写的？
老人|我呀。怕以后老得记不清。
|她念出一串名字，最后停在沈渡两个字上，抬头看看我。
老人|你长高了。
|我二十六岁，早就不会再长高。那一刻却只说：可能是鞋底厚。
|晚月给老人叫了出租车。车门关上以前，老人把保温桶往我手里推。
老人|他吃不上，你们吃。天这么冷。
|桶底还温着。我抱着它，看见晚月在发抖。
林晚月|回家吧。唐瑶要骂人了。
`,{next:'c02',set:{witness_name:true},ambient:'street',time:'旧医院门前 · 18:26'});
  N('photo_negative','显影盘里的空位','darkroom','lin:0',`
|我把电话交还给晚月，重新配了一盘药水。

|晚月说了声好。声音里有松了一口气的感觉，也有别的什么。

|她看了一会儿，用胶带把袋口都封好。
|走出暗房时，我从桌脚抽回辞职信。纸已经压皱了。我没拿给她，也没扔。
`,{next:'c02',set:{kept_copy:true},ambient:'indoor',time:'照相馆 · 18:23'});
  N('c02','十一只碗','kitchen','tang:4,lin:3',`
唐瑶|你们两个，谁先解释？
|锅里的汤咕嘟冒泡。唐瑶抱着胳膊，围裙上沾着一块面粉，气势却像握着我们两个人的房产证。

|长夏公馆的租户有十一个。我的房间最小，门却总关不上，夏天能听见每个人上楼的脚步。

`,{time:'长夏公馆 · 19:07',mood:'warm',choices:[C('把她的碗和我的换一下。','dinner_swap',{fed_tang:true},{tang:3,shen:1}),C('去叫楼上的人，菜快凉了。','dinner_up',{went_up:true},{su:2,ye:1})]});
  N('dinner_swap','焦一点的那份','kitchen','tang:4',`

  N('dinner_up','门缝里的第四小节','stairs','su:3,ye:0',`

  N('c03','晚饭后的雨','home','bai:4,luo:3',`

  N('day_bread','最后一袋高筋粉','kitchen','tang:3',`

  N('day_sound','再听一遍','room','su:3',`

  N('c16','一张请柬','home','gu:0,cheng:0',`

  N('c17','第一个回家的人','library','gu:0,lin:0',`

  N('c18','还有第三条路吗','library','cheng:0,ye:0',`

  N('choose_a','带走原件','room','lin:0,cheng:0',`

  N('choose_b','留一份原始噪声','roof','gu:0,ye:0',`

  N('choose_c','把门打开','home','tang:0,xu:0',`

  N('a00','仍在值班的电台','street','lin:0,cheng:0',`

  N('a01','话筒前面','archive','cheng:0,lin:0',`

  N('a_early','没有念完的名单','archive','lin:0',`

  N('a_wait','那个说要亲自来的人','street','cheng:0',`

证人|不介意。你们慢慢问。我今天就是来把话说完的。
`,{next:s=>ep(s,1),set:{living_witness:true},chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔门前 · 19:11'});
  N('a03','来自过去的指控','archive','lin:2,cheng:0',`
|我们处理完她那份旧事，再回到值班室，广播里已经换成另一个声音。
守钟人的声音|沈渡。未经核实的材料，不应公开。
|是我自己的声音，比站台里的更清楚。他在每一句之间留了刚刚好的停顿，听起来可靠，镇定，甚至比我更像一个会对听众负责的人。
守钟人的声音|你旁边的人修改过档案。她们也有想隐瞒的事。
|晚月站在门边，脸色一点点白下去。雨声没有关掉广播。
|那声音念出了她在旧照片上做过的修改，又念出雨声当年审核协议时写下的意见。
|有些是真的。有些只说了一半。但它并不需要把所有话都说假，只需要让我们彼此看一眼。
|{{told_call::晚月走到我旁边。她已经知道那通电话，没有再被一次隐瞒推到更远的地方。::晚月看着我口袋里的手机。我知道，她想起站台上我没有说出来的那通电话。}}
林晚月|你那天听到了多少？
|这句话不是对广播问的。
|编导把暂停键压住，等我们自己决定要不要关掉声音。
`,{chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔 · 20:13',choices:[C('把手机放到桌上，从第一通电话讲起。','a_confess',{honest_now:true},{lin:1,cheng:1}),C('先核实广播里的指控。电话的事，我之后补上。','a_verify',{verify_first:true})]});
  N('a_confess','不方便播出的部分','archive','lin:2',`
|我把手机放到桌面。屏幕裂过一角，通话记录里那几个熟悉的名字，突然不像证据，像很多没来得及接住的人。
|我从第一通电话说起，把自己犹豫过、害怕过、暂时藏过的部分一起说出来。
|晚月听到我曾经怀疑她，眼神暗了一点。她并没有因为我终于诚实，就立刻不受伤。
林晚月|我知道了。
|她只说这四个字。过了一会儿，把手机推回我手边。
林晚月|后面的，回去再说。别每次都等出事才谈。
|雨声给录音做了副本，公开的内容重新列在另一张纸上。我们的私事没有顺手塞进去，充当一次感人的证明。
|编导重新打开话筒。她说，刚才说到有人修改过档案，那么我们从具体修改了什么，继续。
|广播里的我安静了一秒。那一秒不完美，像程序没准备好，人会承认自己也有错。
`,{next:'a04',set:{group_trust:true},chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔 · 20:28'});
  N('a_verify','先看原件','archive','cheng:0',`
|我把那份协议重新铺开。雨声站到桌边，开始一条一条指出广播省略的部分。
|不是所有指控都因此消失。她承认过的疏忽还在，晚月删改过的底片也还在。
|我们没有把对方说错的一句，拿来抵消自己真的做过的事。
|编导逐条复述，热线那头有人反对，也有人说终于听清了。没有整齐的掌声。
|晚月在一旁重新装相机。她左手不好用，背带的扣环扣了两次。我想帮，她轻轻避开。
|我知道不是因为她不需要帮忙，是因为有句话还被我放在以后。
|她没有离开。工作仍然可以一起做，亲近却暂时不能假装原封不动。
|节目继续的时候，她把原始底片放到灯下，稳稳地压住。
|我把电话留在桌面，没再塞回口袋。这不算已经把话说开，但至少不能再装作没有那件事。
`,{next:'a04',set:{public_proof:true},chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔 · 20:31'});
  N('a04','一支会漏墨的笔','archive','cheng:0',`
|转播的街区越来越少。不是没人听，是印着台标的设备逐渐失效。钟房比我们更容易复制那些标准而正确的东西。
|一位居民打来电话，说她家旧收音机还能响。天线折了一半，用饭勺接起来的。
|初遥在电话那头笑出了声，问她饭勺是什么材质。编导用红笔把这个不体面的办法写到白板上。
|雨声把撤回申请夹到最上面。现在需要一个能核对身份的人，承担这份材料来自哪里的责任。
程雨声|匿名也可以播。只是以后有人追问，我们得重新找证明。署名，就不能再把你只当被救回来的人。
|她把我的笔放下。笔帽沾着蓝墨，甩了两下才写得出字。
|我想起当年按页收费的临时工作。也许那时我根本没想过，一页纸会这么重。
`,{chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔 · 20:57',choices:[C('写下自己的名字，也写下当年做过的事。','a_signed',{owned_fault:true}),C('先让证据自己说话。暂时保留我的身份。','a_anon',{kept_identity:true})]});
  N('a_signed','沈渡，不止一个签名','archive','cheng:0',`
|我在第一行写沈渡。接着写工作地点、扫描的页数、当年接受过的指令。
|有些事我想不起来。我把想不起来也写进去，不用一段漂亮的自责把空白填满。
|程雨声看完，没有替我修改措辞。她在自己的那部分签名，把两页订到一起。
|广播念到我的名字时，我左手的轮廓抖了一下。窗外，原本用来保存我的那一张空椅子，慢慢出现裂痕。
|守钟人说，承认这些，你就不再是无辜的人。
我|我也许本来就不是。
|这句话说完，我先害怕起来。没有人能保证它的代价刚好适合我承受。
|雨声伸手，把我写到发凉的笔帽扣好。她说回去以后，还有很多话要问。
|我把笔收回去，告诉她我不会换号码。她终于抬头看了我一眼。
`,{next:s=>ep(s,2),set:{named_anchor:true},chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔 · 21:13'});
  N('a_anon','暂时不署名的纸','archive','cheng:0',`
|我把身份页折进文件夹，留下可以核对的原件。
我|我现在还没弄清自己经历过什么。不能用一个签名，替所有空白负责。
|雨声想了一会儿，点头，在文件夹上写下我的联系电话，又抄了一份给我。
|编导把材料标成来源待公开，念得很清楚。有人因此不相信，有人仍愿意讲自己的经历。
|我的手没有继续变淡。代价是热线里关于我身份的质疑一直没有停。
|我们把能核实的部分重复了一遍，不能核实的留下。节目不那么好听，也没在某个激情澎湃的句子上结束。
|离开话筒时，程雨声提醒我，这不是把以后也一并放弃。
|我说知道，把文件夹拿回手里。
|走到门边，我又回头，把现在住的地址添上。程雨声没有说话，给那张纸重新压好镇纸。
`,{next:s=>ep(s,2),chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔 · 21:17'});
  N('a06','没有画在新图上的楼梯','stairs','luo:0,bai:0',`
|我们回来时，广播塔的正门已经不见。人们挤在转门原来的位置，有人用椅子砸玻璃，碎片落下，又立刻恢复。
|编导还在楼上。她通过电话告诉我们，主机开始自动播放一份完整的名单。太完整了，连没人记得的细节，都被替他们填好。
|星燃用绳索锁住承重柱，准备从窗外上去。她右肩刚换好药，抬起来的动作仍然很慢。
|露露拽住绳尾，看向楼后那堵没有门的墙。新图上那里是封死的，旧图散在不同人手里。
|{{back_stair::我摸到口袋里的信封。邮递员交给我的路线图还在，背后那道梯子，他每天都走。::墙面平整得没有一处缝。有人记得那里曾经有门，但没人说得出具体位置。}}
|{{lived_map::我想起蔚蓝让杂货店老板画的那张歪图。路不一定要画得准，得有人真的走过。::蔚蓝在电话里问，有没有人知道这里从前怎样进出。她不要新的标准图，要旧的。}}
|楼上响起第一声铃。星燃把绳扣扯紧，等我给她腾出位置。
`,{chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔外 · 22:09',choices:[C('往楼后走。先找那道有人用过的楼梯。','a_stair',{took_back:true}),C('守住绳尾，让星燃先从窗外上去。','a_rope',{took_rope:true},{luo:1})]});
  N('a_stair','走过这里的人','stairs','xu:0',`
|我们绕到楼后。雨顺着墙往下流，手电的光怎么照，都照不出想象中的门。
|{{back_stair::我按路线图往左走了七步。第八步，鞋尖踢到一块稍高的台阶。门在暗处，不在平整的墙上。::我找不到。只好沿着墙，一段一段喊人，问有没有曾在这里上过班的人。}}
|{{lived_map::蔚蓝把杂货店老板的手绘图展开，找到两张歪斜地图共同画过的转角。墙上的门缝终于不再消失。::蔚蓝用铅笔记下每一个回答。有人说得不准确，有人已经记不住，她都没有急着划掉。}}
|{{back_stair::楼梯比我们想象的窄。我先钻进去，从里面把门推住，给后来的人留路。::等门终于出现，楼上的主线路已经完全断了。我们来迟了一点，至少这次没有把来迟说成没人努力过。}}
|我们爬上楼。编导没有等着被救，她已经拆下硬盘，把原始录音装进了外套口袋。
|她看见我们，第一句问的是外面还有多少人。
|我接过硬盘，说不知道，但有人给我们开了门。
`,{next:'a07',set:s=>({archive_saved:!!(s.flags.back_stair||s.flags.lived_map)}),chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔后楼梯 · 22:27'});
  N('a_rope','绳索的另一端','stairs','luo:2,bai:0',`
|星燃没有逞强跳过去。她先试了承重，喊露露把第二道绳锁好，再一点点向上爬。
|我站在下面，握着会磨破手的绳子。这一次，勇敢没有漂亮的剪辑。她每往上一点，都要喘很久。
|她翻进窗的时候，右肩还是脱了力。露露在对讲机里叫她不要站，先把固定点扣好。
|楼上传来咔哒一声。绳子不再绷在她腰上，转交给了真正能承住重量的横梁。
|我们把设备一件件吊下来。硬盘还在，编导也下来了，星燃最后，脸色白得吓人。
|她靠着墙，让知夏检查。没有说值了，也没有拿大家都安全了取消自己的疼。
洛星燃|你回去得替我扶一周梯子。
我|两周。
洛星燃|别加戏。
|她笑了一下。楼上的台标熄了，口袋里的硬盘还温着。
`,{next:'a07',set:{archive_saved:true,luo_hurt:true},chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔外 · 22:31'});
  N('a07','一座城的杂音','street','su:0,ye:0',`
|主塔不能用了。初遥蹲在雨棚下，用拆下来的接口接上居民家的收音机。有人找来饭勺，有人拿来铜线，还有人把自家的旧功放抬了出来。
|晴禾把原始录音拆成短段。她没有滤掉咳嗽、口误和那些说着说着就找不到词的停顿。
|{{living_witness::那位亲自赶来的老人坐到临时话筒前，重新说了一遍自己的姓。旁边有人接话，说我记得你。::最先被我们念出名字的几条街亮起来。有人把缺掉的那一页送回来，说还有这些人，你们没来得及念。}}
|电话一个接一个。声音重叠，回授尖叫，远称不上好的节目。
|守钟人的声音从最清晰的那一路插进来。它说可以修正所有噪声，为每个不完整的人补齐最后的故事。
|我手里的线路总开关发烫。把它维持在这里，我能继续控制谁被听见；把线路分出去，有人会说错，有人会反驳，也有人会不听我安排。
|晴禾抬头看我。她没有说该怎么选，只把那份没剪掉空白的录音推到了我手边。
`,{chapter:'灯塔篇 · 没有被念出的姓名',time:'广播塔下 · 23:03',choices:[C('拆开总线。让每个街区接住自己的声音。','a08',{world_shared:true}),C('保住这一只话筒。我把剩下的名字继续念完。','a08',{world_scar:true}),C('让钟房补完。至少今天，不再有人被遗漏。','bad_broadcast',{perfect_list:true})]});
  N('a08','说错了，也重新说','street','',`
|{{world_shared::我把总线拆开，交给每个愿意接住它的人。第一句话就念错了，对面的老人骂了一句，随后自己纠正。::我留在话筒前，把一页页纸接过来。嗓子越来越哑，有些字，我必须请别人重新教我念。}}
|广播没有变得美好。它只是从一个从不出错的声音，变成许多个会相互争辩的人。
|钟房的铃声试着盖过去。第一声，第二声。每次停顿，都有人把刚才没说完的补上。
|{{archive_saved::口袋里的硬盘仍然可以读出。原始录音和更正一起留下，没有一份被直接盖掉。::有几段录音永远留在楼上。我们把那些空白公开写出来，没用好听的版本把它们补满。}}
|我在雨里看见守钟人的影子。他和我长得一样，站得很远，似乎第一次不知道该替谁说下一句。
|然后，街角亮起一面玻璃。里面出现一个，她一直不肯彻底告别的人。
|钟房没有立刻接受失败。它把最后一个问题，送到我们面前。
`,{next:s=>ep(s,3),chapter:'灯塔篇 · 没有被念出的姓名',time:'鹭川街口 · 23:17'});
  N('a09','更正启事','street','lin:3,cheng:3',`
|她从那一面玻璃前走回来时，街上的广播还在响。没人为这个小小的归来停下整座城。
|我握住她伸过来的手。它并没有因为做过一次正确的事，就不再发抖。
|天边那道灰白，比清晨更亮了一点。钟楼的指针第一次离开二十三点十七分。
|雨声把最后一张纸贴到值班室门上。不是胜利公告，是更正启事。里面有我们的错，也有仍然无法确认的名字。
|{{owned_fault::我的名字在第一行。以后会有人找来问，我到底做过什么。我还没想好每一个答案，但不能再假装那不是我。::我的身份页仍然单独封着。雨声把它交还给我，提醒我，暂时没有公开，不等于这页已经作废。}}
|晚月拍了一张照片，镜头里有人哭，有人仍在吵，角落一位编导终于坐下来吃完冷掉的面包。
|我问这张要修吗。她说曝光能调，里面的人，先别动。
|我们走回公馆。有人在门内给我们留着灯，但没有谁因此答应以后永远不走。
`,{next:s=>ep(s,4),set:{main_clear:true},chapter:'灯塔篇 · 清晨的更正',time:'九月二十一日 · 05:46',mood:'dawn'});
  N('b00','钟楼没有朝向外面的门','bell','gu:0,ye:0',`
|钟楼的门锁没有钥匙孔。南枝拿出工作证，贴到门缝边，里面传来很久以前那种针式打印机的声响。
|姓名被一点点打出来。不是顾南枝，是零号。
|她盯着那两个字。初遥没催，先把工具袋放到地上，把最短的一把螺丝刀递给她。
叶初遥|这边有个检修扣。证件不管用，也可以用这个。
|南枝接过去，嘴角动了一下。她蹲下，开始拆那块根本不值得用神秘形容的铁片。
|门开了。楼内不是无底的阶梯，是一座仍在运作的老交换局。无数窄纸条从机器里吐出来，写着每个人最后一次被认真叫过的名字。
|我的那条空着。旁边的计数器每过七秒，就试着往上打印一次。
|电话里的声音从楼上传来。
守钟人|你迟到了。
|我抬头，先看见那个人的鞋。和我的一样，右边鞋尖磨得更多。
|再往上，是我十年以后的脸。
|他没有摆出敌人的姿态。只是让开一点，露出一把摆在火炉旁的椅子。
守钟人|你们冻坏了。坐一会儿。
`,{next:'b01',chapter:'逆潮篇 · 另一个自己',time:'鹭川钟楼 · 18:06'});
  N('b01','十年以后，也不会变聪明','bell','gu:0,ye:0',`
|我没有坐。那个人看了我一会儿，说，我当年也是这样，以为不肯坐下，就能证明自己没有被说服。
|他从火炉旁端来一只杯子，碗沿缺了一角，画着一朵很丑的小花。
|我认识那朵花。连碗底洗不掉的茶渍都一样。
守钟人|你后来会想念这个。不是伟大的事。就是这只碗。
|南枝伸手接过，杯口的热气在碰到她指尖以前，倒着缩回去。
顾南枝|它没有温度。你只留了看上去热的部分。
|守钟人没反驳。他看着我，眼神里有一种比敌意更难忍的熟悉。
守钟人|你知道我为什么留下吗？每次放开一条线，就会有人从照片里消失。
|他抬起手，袖口下没有完整的掌纹。每一道线都通向房里某一卷旧纸。
|他的碗底磨出一圈白痕。我忽然不敢细想，十年里，他究竟重复过多少次这样招呼自己。
|初遥把原始录音放到桌上。里面那句不要回站台，每次都有一点不同的底噪。
|守钟人看见了，脸上第一次有了别的表情。
守钟人|把那个关掉。

  N('h01','远处还有灯','street','shen:0,xu:0',`

  N('h_clinic','一双不肯穿上的鞋','hospital','shen:0,luo:0',`

  N('h_neighbour','有些门得喊小名才会开','street','tang:0',`

  N('h03','公馆快装不下了','home','xu:0,bai:0',`

  N('h04','借一盏灯的人','home','bai:0,xu:0',`

站务员|听说你们在接人。这个放门口，迷路的就能看见。

  N('h_test','干净得没有来路','home','bai:0',`

  N('h_own','不够亮的灯','home','xu:0',`

  N('h06','桥那一边','bridge','luo:0,shen:0',`

  N('h_bridge','能回来的绳结','bridge','xu:0,luo:2',`

|她松开手，把硬纸板放到桌上。
林晚月|不检查。你自己垫。
|我拆开封口，发现她把所有剪过的接缝都编号了，连最难看的那张也在。
我|漏了一处。
|我指着她母亲照片背后的胶带。她看了一会儿，拿笔补上第十七号。
林晚月|现在没漏了。`,
 one:`|晚月把相机架在文件前，要录一段更正声明。她按下录制，第一句说了四遍。
林晚月|我在三年前……
|她停下来，拿起相机要删。我按住删除键。
我|先留着。
林晚月|这一段根本不能看。
我|那就下一段。别把上一段抹掉。
|她把笔放到我手边。哪一页归谁，怎么留副本，都还没写。`,
 truth:'让她在原始记录旁写清每一次剪改，由两人签收。',work:'不录声明，先封存原片，把副本交给第三个人。',
 truthReply:`|她一项一项写。写到把我送回站台那次，停了很久。
林晚月|这一项也公开？
我|先留在案卷里。公开哪部分，还要问被拍的人。
|她点头，把没有修饰过的时间写下。笔压太重，最下面那张也印出痕迹。`,
 workReply:`|我把原片装进硬盒，晚月去叫温乔或雨声来签收。她没再挑看起来更好的那张。
林晚月|这张损伤最大，偏偏最能看清日期。
我|就留它。
|她用废相纸给盒角垫了四层，封条让别人贴。`,
 ready:(s,t)=>t==='truth'?(f(s,'shared_custody')||f(s,'lin_attention')):((f(s,'kept_copy')&&!f(s,'negative_seized'))||f(s,'distributed_copy')),
 two:`|换电池的空当，晚月蹲在台阶上贴胶布。胶布粘住指头，撕下来又卷成一团。
我|给我吧。
林晚月|不用。
|她试了第三次，终于把手伸过来，眼睛看着别处。
林晚月|刚才不是冲你。我烦我自己。`,
 near:'替她重新包好手，把刚才没说完的话说完。',company:'找来干手套，让其他人也来换湿衣服。',
 nearReply:`|我把她粘歪的胶布拆掉，没碰露出来的旧伤。她的手一直僵着。
我|你改过的事，我还会问。
林晚月|问吧。
我|但你不用每次见我都准备挨骂。
|她看了我一眼，把没伤的那只手轻轻放到我腕上。`,
 companyReply:`|我叫来另外几个人分手套，晚月负责把湿胶片转进新盒。我们隔着桌子递东西，谁都没有再躲。
林晚月|拿右边那盒。左边是废片。
|她第一次在我拿错以前提醒了，而没有直接替我拿走。`,
 crisis:`|保全终端突然推出一张完整照片。晚月母亲的脸，比任何旧底片都清楚。
|背面附着“停止追责确认”。只要晚月签字，照片永久保留；她修过的十七处接缝也会一并抹平。
林晚月|他知道我会看。
|她还是把照片拿近了，指尖碰到边框，自己的手也开始褪色。
我|别碰背面那一栏。
林晚月|我知道。我只想再看一眼。
|终端开始倒数冲洗时间。原件盒就在我手里。`,
 good:'把有双人签收的原件交给她，让她亲自终止重印。',repair:'先切开打印链路。保住她，原片损坏以后再修。',dream:'签下停止追责，让这张完整照片留下。',bad:'扯碎照片，把她硬拉出来。',
 release:`|我把编号盒打开，晚月对照接缝，按住终端的取消键。
|照片从母亲的眼角开始褪色。她低着头，一直没松手。
林晚月|原来的还在，对吧？
我|在。十七号下面。
|她把那张模糊的旧片握在手里，坐在地上，很久才站起来。`,
 repairText:`|我断开链路。晚月的手恢复了颜色，底片盒里最老的那张却被药水灼掉一角。
|她用镊子把残片夹起，没有怪我，也没说没事。
林晚月|先走。回去我自己试。
|我把碎片收好。后来那一角有没有修回来，她一直没向我保证。`,
 later:`|照相馆门外贴了暂停营业。晚月花一上午拆掉过去标着“完美修复”的样片。
|一位客人骂她前后不一，她听完，把能退的钱算清。
林晚月|这两个月不招学徒。也交不起你的工资。
我|我来拿杯子。
|她指了指柜子，里面我的杯子还和她的并排放着。`,
 confession:`林晚月|周六我去买新柜子。你要是还来，就给你留一格。
我|只是柜子？
|她把卷尺扔过来，没扔准。
林晚月|你非得让我说那么清楚？`,
 promise:`|我把杯子放回原位，说周六一起去。晚月拿出便笺写时间，写了个八点，又划成九点。
林晚月|睡晚一点。柜子不会跑。
|她把纸贴到我杯子上，这次上面没有要改的错。`,
 endings:{true:`|新柜子送来时卡在楼梯口。晚月笑我量错，我把她写的尺寸拿出来，她看完，悄悄折进兜里。
|晚上我们一起关店。她主动给我看新修的底片，我挑出一处不对，她也没生气。
林晚月|明天改。今天先吃饭。
|门锁了两次才锁好。她等着我，把没伤的手伸过来。`,normal:`|晚月给我留了柜子，却没给我钥匙。那盒旧片还需要一点点查，我们也还在学着把难听的话说完。
|我有时来，有时隔几天。她不问我什么时候一定回来。
|门上多了一个电话。她说来之前打一下，省得我又淋雨等。`,work:`|我和晚月重新签了工作合同。工时、分成、原件保管，写了整整三页。
|她把第一份更正委托交给我，看完报价，挑出一个少写的零。
林晚月|你还是别管收钱了。
|我把那页抽回去，自己改。`,part:`|离开那天，晚月给我拍了一张很普通的证件照。我看着有点呆，让她再拍一张。
林晚月|这张挺像。
|她还是给我重拍了。两张都装进袋子，没有替我选。
|到站以后我发去消息。她回了一个“收到”，又补了一句：记得吃饭。`,dream:`|新的照片永远清楚。晚月每天擦一次玻璃，外面的更正申请也一封封退回。
|我问能不能再看看旧片，她说不必了，已经有最好的这张。
|那句话后来越来越常听到。暗房里再也没有一张等着修改的照片。`,rain:`|我撕掉照片的时候，也撕断了连着她的那段原始记录。
|晚月的手从我掌心里变轻。她没来得及说完“先别”。
|照相馆的钥匙还在，但柜台后没有人教我怎样修补这次的损坏。`}},
 su:{bg:'room',prop:'record',intro:`|晴禾把两只耳机都塞到包里。我提醒她已经带了一副。
苏晴禾|左边那只是坏的。
我|那还带？
苏晴禾|能当备用麦克风。别帮我扔。
|她把音量调小，低头对每个接头吹了口气。
|门口有人叫她，她没听见。我碰了碰桌角，她才抬头。
苏晴禾|站这边说。那边真的听不清，不是装酷。`,
 one:`|晴禾打开一段我出门前的录音。声音停在“等我回来”。
苏晴禾|我以前把后面删了。听起来比较像一句保证。
我|后面是什么？
|她按开原轨。里面我又说：来不及就别等我，先吃。
|她盯着那段波形，手指悬在删除键上。
苏晴禾|我拿这半句生了三年气。
|外面的线路只空出几分钟。她问我，这段准备怎么留。`,
 truth:'把删掉的后半句接回去，保留原始时间。',work:'另做一份标明缺口的音轨，供其他人独立复核。',
 truthReply:`|我按着原始时间把后半句接回去。晴禾听完整段，摘下耳机。
苏晴禾|再放一次。
|第二遍，她没哭，反而气得笑了。
苏晴禾|你连不守时都交代得这么清楚。
|她把完整文件另存，名字只写日期。`,
 workReply:`|我们把能确定的时间标在一条轨上，无法确认的留空。晴禾把处理步骤逐条写给初遥。
苏晴禾|别把我的耳朵当仪器。别人听不出，得能用原数据复核。
|她把耳机交出去，自己坐远一点，等另一个人的结论。`,
 ready:(s,t)=>t==='truth'?(f(s,'heard_breath')&& (f(s,'sound_help')||f(s,'signal_raw')||f(s,'went_up'))):(f(s,'signal_raw')||f(s,'after_silence')),
 two:`|等转换文件的时候，晴禾去自动贩卖机买水。机器吞了钱，什么也不掉。
苏晴禾|它也学会假装听不见了。
|她蹲下来拍机器底部。我拦了一下，她说别怕，没打算拆。
|第二瓶终于掉下来。她递给我，一边耳机还挂在领口。`,
 near:'在她听得清的那边坐下，陪她把水喝完。',company:'拿水去分给值班的人，给她留个安静位置。',
 nearReply:`|我在她右边坐下。她抬头确认了我的位置，肩膀松了一点。
苏晴禾|以后跟我说话，别一边往外走一边说。
我|那你也别什么都说听到了。
|她点头，把另一瓶没开的水贴到我手背，凉得我一缩。`,
 companyReply:`|我把水分给其他人，替晴禾挡掉两次问进度的催促。文件转换完，她自己走过来解释，没再让我代答。
苏晴禾|可以听。一次一个人，别同时开四个喇叭。`,
 crisis:`|终端把所有修过的声音并成一轨，扬声器忽然响到刺耳。
|晴禾捂住左耳，听力辅助器发出尖锐啸叫。
苏晴禾|别把线全扯了！原轨还在里面。
|屏幕提示：覆盖原始记录，可恢复完整声场。里面有她再也听不到的高音，也有母亲的告别。
|覆盖键旁，未处理的那七秒只剩一条很淡的线。
|她伸手想调低音量，手却抖得找不到旋钮。`,
 good:'用留存的原轨断开回授，让她自己关掉覆盖。',repair:'先拔掉功放，保住她的耳朵。原轨只能抢救剩下的。',dream:'允许覆盖，让她再听见完整的那首歌。',bad:'砸坏扬声器，把正在写入的主线一并扯断。',
 release:`|我按原轨的空拍切开回授。啸叫停了，晴禾立刻取消覆盖。
|她摘掉辅助器，让耳朵彻底静下来。过了一会儿，才用纸写：现在别跟我说话。
|我在旁边坐着。她把纸翻过来，又写了句：你也坐下，走来走去好烦。`,
 repairText:`|功放断了。晴禾按住耳朵，连着做了几次深呼吸。
|原轨最后一段没有保存成功。她看着空白的文件，摇头让我别继续重启。
苏晴禾|回去再处理。再来一次，我的耳朵撑不住。
|我们把损坏的卡也带走，没承诺它一定还能读。`,
 later:`|晴禾把练琴时间改成下午。邻居上楼找她，原本准备吵，看到门口贴的时段表，又把话收回去了。
|她放下一张只写了半页的新谱子。
苏晴禾|今天就这么多。别问为什么少。
我|我来还水钱。
苏晴禾|那你下次再来。硬币我不收。`,
 confession:`苏晴禾|下周有一场小演出。第一排太响，我给你留了侧边。
我|我是去看演出，还是去看你？
苏晴禾|……都有。不许迟到。`,
 promise:`|我把日期写进手机提醒，故意开大音量让她听见。她伸手把音量按回去。
苏晴禾|我听得见。你坐我这边就行。
|她把票放在我掌心，手指停了片刻。`,
 endings:{true:`|演出时她弹错了一个音，抬眼看我。我没装作没听见，她瞪了我一下，自己重来。
|散场以后，我们蹲在后台吃便利店饭团。她把难咬的海苔那边掰给我。
苏晴禾|奖励你的好耳朵。
|我笑得噎住，她又忙着找水。`,normal:`|晴禾还在整理受损的录音。有些片段只剩空白，我们没有再补进想象的声音。
|我陪她去复查听力，之后去吃面。她嫌店里太吵，我们端到门外的小桌。
|她让我坐右边。这次我记住了。`,work:`|我们做了一个小声音档案室，公开每一次剪辑的位置。
|第一单客户要求“修得像从来没坏过”。晴禾拒绝，之后又担心这个月房租。
|我给报价单加了检查费。她看完说，这个可以留。`,part:`|出发那天，晴禾给我发了二十秒语音。前半段讲车站怎么走，后半段一直没说话。
|最后她说，到了报个平安。录音没有删掉中间的停顿。
|我回了一条很长的消息，删掉，重新录了句“到了会说”。`,dream:`|新录音里没有错拍。晴禾弹不弹琴，它都会准时响起。
|后来她很少再碰琴键。她说已经听到了最好的一遍，没有必要再坏一次。
|我听着那首歌，想不起她上一次皱眉的样子。`,rain:`|回授线被我一起扯断。写入到一半的声音，把她的最后一句也卷了进去。
|耳机里还有“别”，后面是尖锐的空响。
|我们存下了无数文件，没有一份能替她把这句话说完。`}},
 gu:{bg:'library',prop:'paper',intro:`|南枝给每件工具贴标签。我的包也被贴了一个，写着“勿自行联网”。
我|这是贴工具还是贴我？
顾南枝|贴包。人撕了也会犯。
|她说完才意识到不好笑，低头重新核对钥匙。
|其中一把挂着零号铭牌，背面是她小时候的照片。
我|你自己的？
顾南枝|原件没有了。别从这张照片猜我喜欢什么。`,
 one:`|南枝的权限卡自动弹出一个建议：只要恢复零号管理，她就能替我们完成所有核查。
顾南枝|这是我写的默认项。
我|为什么默认？
顾南枝|测试的时候，别人总按错。我懒得让他们重来。
|她按住取消，系统反复弹出。原来连取消也需要她替别人确认。
|她把自己的代码本推到我面前，等我看最下面那一行。`,
 truth:'把她留下的单人否决权划出来，要求交给独立复核。',work:'先做一个能退出的版本，找第二个人当场试。',
 truthReply:`|南枝看完那行代码，拿红笔划了两道。
顾南枝|这段不是何启年加的。是我。
|她把修改者写成自己，连版本历史一起留存。雨声带走副本，她没有再要求先给她审过。`,
 workReply:`|我们做了一个空记录让别人测试。第一个人选退出，按钮真的停在确认页，没有自动返回默认。
|南枝看得有点不安，忍着没伸手。
顾南枝|再试错一次。故意的也行。
|她这回看着别人把整段删掉，没有替他恢复。`,
 ready:(s,t)=>t==='truth'?(f(s,'visit_record')||f(s,'dual_control')):(f(s,'signal_key')||f(s,'keeper_testimony')),
 two:`|南枝泡了两杯速溶咖啡，给我的那杯里撒了盐。
我|你这是警告我？
顾南枝|袋子颜色一样。
|她想倒掉重泡，我先把两杯都拿远。
我|去喝水。
|她伸手来抢自己的杯子，又慢慢收回。
顾南枝|行。我的脑子现在确实不值这杯咖啡。`,
 near:'陪她离开屏幕，坐下来喝杯白水。',company:'接一班操作，让她去睡，叫别人一起核对。',
 nearReply:`|她坐了两分钟，手指还在膝上敲键。我把水杯推近，她才停下来。
顾南枝|别因为我会做，就觉得我一直愿意。
我|你也别什么都接。
|她笑了一下，很短，接着在我肩膀上靠了一会儿。`,
 companyReply:`|我叫来第二个人核对，南枝把操作本交出来。
顾南枝|有错叫醒我。没错别叫。
|她在折叠椅上睡着。我们按本子做，真出了一个小错，也靠两个人查了回来。`,
 crisis:`|零号权限发现授权被修改，开始恢复顾南枝的默认记录。
|她的工作证先变成零，声音接着开始重复。
顾南枝|我不同意恢复。我不同意——
|系统把“不同意”当作异常，替她改成了“已确认”。
|恢复全部权限能立刻保住她的形状，同时把所有人的退出都交回她一个人手里。
|她用最后还能动的手指，按住取消页。`,
 good:'拿出已经通过独立测试的退出记录，绕开零号复核。',repair:'隔离零号，先保住本地副本。她的旧权限全部放弃。',dream:'恢复完整零号权限，先留下她。',bad:'毁掉零号主记录，把她从系统里强行拔出来。',
 release:`|我提交第二人的复核记录。取消指令终于没有被改写。
|南枝把自己的管理卡拔出来，折成两半。她的声音停了片刻，再开口时已经不同步了。
顾南枝|别给我新的。我今天不管了。
|她把碎卡放进证物袋，手还在抖。`,
 repairText:`|隔离完成。南枝靠在墙边，摸了摸自己的脸。
|她还认得我们，旧研究目录却都打不开了。新的管理卡，她也不能再用。
顾南枝|记录缺了就标缺。别替我补。
|她接过纸和笔，重新写下现在记得的事。`,
 later:`|南枝不再管公馆的路由器。初遥改了密码，忘了告诉她，她在客厅里愣坐了十分钟。
我|直接问不行？
顾南枝|正在练。
|她真的给初遥发了消息，没有进后台重置。午饭时她把这事说出来，大家笑得很不客气。`,
 confession:`顾南枝|周日，我想去一个没去过的地方。不要提前替我把路线全查好。
我|迷路怎么办？
顾南枝|问路。你会吧？`,
 promise:`|我说会，她把那张空白行程递给我。
顾南枝|那就一起。晚点出门也行。
|她第一次没在时间旁边填容错范围。`,
 endings:{true:`|我们在郊外坐错了一班车。南枝盯着站牌，承认是自己看反了方向。
|我去问司机，她留在原地买两杯水。回来的时候，她没有已经决定好怎么补救。
顾南枝|怎么走？
|我告诉她，我们一起等下一班。`,normal:`|南枝重建自己的记录，缺的地方仍然空着。我帮她找资料，她会问我从哪里找来，再决定留不留。
|有时她又忍不住替我改行程，我提醒，她不太高兴，但会还回来。
|我们都没有把这件事当成已经改完。`,work:`|南枝的新测试组有三个人，谁都能否决她。开会第一天，她就被否了两次。
|她回公馆抱怨，我让她把意见写下来，她瞪了我半天，真的写了。
|第二天，修改版按大家的名字一起提交。`,part:`|我走之前，南枝把有关我的个人分析全部给了我。
顾南枝|你可以删。不用告诉我理由。
|我留下共同做过的项目，删掉了她替我预测的明年。她看见空页，点了点头。`,dream:`|零号恢复后，再也没有人做出不符合预期的选择。南枝替我们筛掉危险，也筛掉那些她没有把握的相遇。
|她每天都说运行正常。
|我问她累不累，她查了一下状态表，回答没有异常。`,rain:`|主记录被撕裂时，南枝还在按取消。她的指尖越过按钮，穿过桌面，再也碰不到任何东西。
|纸上留下半个没写完的顾字。
|我照着补完，系统却没有认出她。`}},
 tang:{bg:'kitchen',prop:'cup',intro:`|唐瑶塞给我三个纸包。我说太重，她又拿回一个。
唐瑶|那个是我的。差点忘了。
|我没忍住笑，她瞪我，手上的面粉蹭到眉毛。
我|这里。
|她擦错一边。我帮她擦掉，才看见她鞋里垫着一块纱布。
唐瑶|知道疼。没聋。不准一路问。`,
 one:`|唐瑶藏了一包面粉。露露来问，她先说没有，我看向橱柜，她才把袋子拖出来。
唐瑶|这是我妈最后那份配方要用的。我想留着。
|她盯着袋口，话越说越硬。
唐瑶|怎么，非得我把自己的也全给出去，才算我会做饭？
|外面的人只是问今晚还够不够，她却像已经被指责了很久。
|我把橱柜门关上，等她说完。`,
 truth:'告诉大家这是她留下的一份，重新核算公用物资。',work:'用现有食材改配方，留下原来的那一袋。',
 truthReply:`|我把私人物品和公用物资写成两列。唐瑶盯着自己的名字，终于没有抢过笔划掉。
唐瑶|还有两袋茶也是我的。
|她说完，观察大家的脸色。没有人骂她。露露问了一句能不能借一点，她说可以，但只拿半袋。`,
 workReply:`|我们用剩的面粉和土豆试了一盘，烤得有点硬。唐瑶咬一口，嫌弃半天，又拿给别人尝。
|几个人说能吃，她才在新配方旁写了自己的名字。
唐瑶|这是赶工版。别出去说我平时这水平。`,
 ready:(s,t)=>t==='truth'?(f(s,'tang_self')||f(s,'fed_tang')):(f(s,'food_ready')||f(s,'clinical_clean')),
 two:`|等下一班车的时候，唐瑶把头靠在米袋上睡了。对讲机一响，她整个人弹起来。
唐瑶|谁没吃？
我|叫的是电量，不是饭量。
|她揉了揉脸，坐回去，手还伸向围裙口袋里的便笺。
唐瑶|总觉得漏了谁。`,
 near:'把她那份拿出来，坐在她旁边一起吃。',company:'接过分配表，和其他人替她值下一班。',
 nearReply:`|我拆开属于她的纸包。她一开始只肯吃半个，后来把另一半也拿走了。
唐瑶|别盯着我吃，像我欠你一碗。
我|十一只。
|她笑得呛住，抢走我手里的水，喝完才说借一下。`,
 companyReply:`|我们几个人接过表，按上面的名字分发。唐瑶在旁边憋着，想插话，露露直接把椅子转了个方向。
|她睡着以前还提醒烤箱要关。我过去检查，已经关得好好的。`,
 crisis:`|储藏室的门重新出现。门里那只旧烤箱亮着，唐瑶母亲的声音喊她把第十一份做完。
|唐瑶进去端盘，盘里做好的面包立刻消失。她又揉了一盆，灶火始终关不掉。
唐瑶|我关过了。它自己又开！
|门边挂着一张排班表，她的名字被填满所有空格。
|只要继续，家人就会一直在；一旦停下，里面的旧家就会熄灯。
|她的手已经烫红，面盆仍往前送。`,
 good:'把她签过的私人份额与交班表放进读取处，停掉无限排班。',repair:'断掉这间厨房的供能，把她带回还有人接班的那边。',dream:'替她接下一班，让这个早晨继续。',bad:'硬砸烤箱，把连在她手上的面盆扯下来。',
 release:`|排班表空出一格。唐瑶先不敢相信，试着把面盆放下，没有新的一盆推来。
|她盯着那只旧烤箱，给母亲留下一块歪歪的面包，才关上门。
唐瑶|走快点。慢了我又舍不得。
|她拉着我先走，没再回头。`,
 repairText:`|电断了，储藏室一点点暗下去。唐瑶抱着配方本出来，最后几页被蒸汽糊成一团。
唐瑶|先别掰，会碎。
|她把本子摊在干布上，自己坐到旁边。那晚别人给她做饭，她没有再起来重做。`,
 later:`|公馆厨房贴了轮值表，唐瑶只做其中两天。第一天轮到我，米饭夹生。
唐瑶|你这是省电，还是准备拿米砸人？
|她笑归笑，没把围裙接过去。我们加水重蒸，菜先吃了一半。`,
 confession:`唐瑶|周一关店。我想出去吃，有人给我端盘子那种。
我|贵的？
唐瑶|对。你现在反悔还来得及。`,
 promise:`|我选了家她念叨过三次的店，唐瑶看完价格，反过来劝我换一家。
我|不是说要贵的？
|她嘴硬了两句，把预订时间记进手机，还把闹钟设早了十分钟。`,
 endings:{true:`|餐厅上第一道菜时，唐瑶习惯性伸手要分。我挡住盘子，她反应过来，先夹给自己。
|结账时我们为了谁付吵了三分钟，最后一人一半。出门她嫌冷，直接把手塞进我外套口袋。
唐瑶|这总不收费吧？
|我握住她的手，没松。`,normal:`|唐瑶偶尔还是会多做一份，做完才发现自己又忙过头。我们把多出来的冻好，下次少做一点。
|她没再把所有人的饭都记在自己头上，我也没装成总能看出她累的人。
|饿了就说，生气也说。公馆比从前吵了些。`,work:`|唐瑶的小店试营业，菜单上写着售完即止。有人催她延时，她指了指关门时间。
|我负责算账，第一次算错，她让我留下洗盘子。十一只，一只没少。
|店里的新配方是她自己的名字，不再借母亲的签名。`,part:`|走前她给我装了太多吃的，又自己拿出一半。
唐瑶|路上会坏。到那边自己找点热饭，别拍给我看，像交作业。
|到了以后我还是发了一张面。她回了句太少，隔一分钟又补：你自己决定。`,dream:`|我们接着做第十一份早餐。她母亲一直笑，锅里的水一直开。
|表上再没有休息那一栏。唐瑶有时问我今天星期几，我答不上来，只记得下一盘还没出炉。`,rain:`|被我砸开的烤箱连着她手里的整段旧记忆。面盆落地，她也跟着失去重量。
|我伸手接，只接到那张烫卷的轮值表。
|最后一格仍是她的名字，没有人来交班。`}},
 luo:{bg:'theater',prop:'thread',intro:`|星燃把安全绳扔给我，要我拉到最紧。我刚用力，她就说不对。
洛星燃|你要检查，不是要跟它打架。
|她用右手示范，左肩一直没抬。
我|还疼？
洛星燃|疼。问完帮我系。
|她把伤侧转给我，这回没嘴硬说自己够得着。`,
 one:`|剧团负责人发来消息，让星燃删掉今晚的监控。她没回，对面直接打来电话。
负责人|大家都靠这个吃饭。你非得出头？
|星燃把手机开成外放，低头拆手上的固定带。
洛星燃|我也靠肩膀吃饭。你倒是给我长个新的。
|电话挂断。演出群把她移了出去。
|露露说还有一份安全检查单可以递，她问我，先处理录像还是先处理那张单。`,
 truth:'保存通话和现场经过，把冒签检查单的事一并送出。',work:'留下录像，先按原图重做承重点，让下一场停下来检查。',
 truthReply:`|我把三份材料按时间订好。星燃在自己没有检查过的项目旁签“不认可”。
洛星燃|我签收过吊索，这个别帮我抹掉。
|她把有利和不利于自己的两部分一起发出去。群里很快有人骂，她关了提示，没删消息。`,
 workReply:`|星燃逐个指出应该检查的位置，我和露露爬上去做。发现第二个松扣时，她脸都白了。
洛星燃|停演。谁说小问题，让他自己站下面。
|我们封了舞台，没有拿另一个人的肩去试它到底有多危险。`,
 ready:(s,t)=>t==='truth'?(f(s,'crew_ready')||f(s,'shared_load')):(f(s,'rigging_map')||f(s,'camera_proof')),
 two:`|星燃想单手开罐头，开了三次都滑。我伸手，她把罐头挪开。
洛星燃|再一下。
|第四次还滑。她盯着罐头，突然自己笑了。
洛星燃|行，你来。别拿这个去烦我一辈子。`,
 near:'帮她打开，坐下听她骂完那通电话。',company:'把工具分给大家，让她只负责指挥这一轮。',
 nearReply:`|我开好递回去，她靠墙坐下，骂负责人，骂吊索，最后骂自己为什么没早点检查。
|骂到没词，她把罐头分了半边给我。
洛星燃|你刚才一句都没劝，挺好。
|她用右拳轻轻碰了碰我的手背。`,
 companyReply:`|我们按她的口令固定工具。她坐在下面盯着，发现不对立刻喊停。
洛星燃|不是我不干活。我这叫监工。
|露露说监工也得交检查表。她骂了一句，还是认认真真写完。`,
 crisis:`|桥面或舞台的追光突然亮起。对面是她等过很久的正式演出机会，不再有人喊她替身。
|录下来的负责人说，只要现在独自越过去，事故记录就撤，主角也归她。
|星燃的脚已经踩到边缘。她看着自己的手，那边连伤都给她修好了。
洛星燃|我练了这么多年，就是想站那儿。
|但安全锁扣仍然是坏的。她一离开承重点，绳就会反向收紧。`,
 good:'拿出核验过的安全记录，按共同检查的承重点接她回来。',repair:'先退回固定地面，放弃这场机会，再拆危险的锁扣。',dream:'解开备用绳，让她完成不会失败的那次飞跃。',bad:'冲出去抓她，用自己的身体承住断开的绳。',
 release:`|我没有喊她勇敢，先把检查表上的承重点报给她。她核对一遍，慢慢退回来。
|最后一盏追光熄了，她盯着黑掉的地方很久。
洛星燃|真可惜。
我|嗯。
|她把坏扣拆下来，塞进证物袋，和我们一起走。`,
 repairText:`|机会从对面的屏幕上撤下。星燃回到地面，弯腰把手搭在膝上。
|我问能不能扶，她点头。我们没有记录齐全的拆除条件，只能封掉这段装置，等专业人员来处理。
洛星燃|下次再有戏，先看检查单。你帮我记住这句。`,
 later:`|星燃找到一份不需要吊威亚的小角色，台词只有四句。她在公馆练了十七遍。
我|背得下吧？
洛星燃|当然。问题是我现在要靠脸演，不是靠飞。
|她对着镜子试了一个表情，自己先嫌弃得笑倒。`,
 confession:`洛星燃|首映不一定有红毯，盒饭大概也不好吃。你来不来？
我|你邀请我看戏，还是一起吃难吃的盒饭？
洛星燃|都行。反正坐我旁边。`,
 promise:`|我答应以后，她把票塞进我口袋。她说别穿得比主角隆重，又替我把领子翻正。
洛星燃|主角还没赚到买礼服的钱。低调点。`,
 endings:{true:`|首映那天我们坐在后排。她的四句台词播完，她没看银幕，转头问我怎么样。
|我说第三句太快，她踢了我鞋尖一下，散场以后却又把那句练给我听。
|走到台阶，她主动拉住我的手，没再用伤侧撑栏杆。`,normal:`|星燃一边复健一边接零散工作。进展慢的时候她脾气很差，骂完会自己回来道歉。
|我不把她每一次咬牙都当成勇敢，她也慢慢肯把“今天疼”说出口。
|我们的约会偶尔改在复健室外的小餐车。`,work:`|星燃在剧团牵头建立安全检查流程，我负责记录和整理。每一场都得签，熟人也不例外。
|有人说她没以前好说话，她回了句谢谢。
|表上的替身和安全员都有名字，再也不是一行“其余人员”。`,part:`|她送我到车站，坚持自己提包，提到一半又递回来。
洛星燃|别以为我逞强好了。是你这个包太重。
|发车前她朝我挥手，用的是右手。几个月后，她寄来新演出的票，让我有空就来。`,dream:`|那次飞跃完美得没有重量。掌声一遍遍响起，星燃从不需要降落。
|她想走回我们这边，幕布却不断把她推向起跳点。
|演出单上只有主角的名字，没有安全员，也没有散场时间。`,rain:`|我用身体承住绳，坏掉的锁扣照旧收紧。两个人的重量，让唯一还能用的固定点断了。
|星燃最后推了我一下，像排练时让人离开落点。
|这一次，她没能回到检查单前签字。`}},
 shen:{bg:'hospital',prop:'paper',intro:`|知夏把空瓶子扔进回收箱，没投准，蹲下捡的时候眩晕了一下。
我|你坐会儿。
沈知夏|你先把药箱提对。温度标签朝外。
|我转过来，她检查一眼，终于坐下。
沈知夏|那张死亡单，你留好了吧？
我|留着。
沈知夏|行。别因为我今晚忙，就当那件事过去了。`,
 one:`|医院发来通知，让知夏修改当夜记录：设备故障，无法判断患者状态。
|她把原件摊在膝上。上面有几次她已经疲劳到写错的给药时间。
沈知夏|改成设备问题，我就能复岗。但真正用过什么药，这张就查不到了。
|她看着手机上的排班。下周少她一个，其他人的夜班会加上去。
我|你想怎么处理？
|她没有立即回答，把那支笔递给我，只让我先拿着。`,
 truth:'保留她写错和更正的全部记录，向独立复核组提交。',work:'先核对每位病人的后续用药，补齐可查的交班单。',
 truthReply:`|知夏把每个更正签上时间，没有涂黑旧字。提交时，她的账号被暂时停用。
沈知夏|至少这份现在不能再替我改。
|她拿起私人电话，逐个联系接班的人，没拿停用通知当成可以失联的理由。`,
 workReply:`|我们按病床逐一核对，把不知道的部分单独标出。知夏不肯让我写“应该没问题”。
沈知夏|不知道就写不知道，后面的人才会复查。
|最后一张交班单有人接收，她才把笔收起来。`,
 ready:(s,t)=>t==='truth'?(f(s,'clinic_reserved')||f(s,'hospital_names')):(f(s,'hospital_names')||f(s,'postal_proof')),
 two:`|知夏的手机震个不停。她拿起来，竟然是电影票的退款提醒。
沈知夏|忘了取消，自动退了。
我|本来准备看什么？
|她看了一眼片名，想了半天。
沈知夏|不知道。选的最早那场，怕晚了我会睡着。`,
 near:'等她交好班，陪她坐下把那场电影的预告看完。',company:'接过非医疗联络工作，让她去睡一会儿。',
 nearReply:`|预告片只有两分钟，她看到一半就困得点头。我把屏幕关掉，她却说没睡。
我|刚才主角叫什么？
沈知夏|……需要知道吗？
|她自己笑了，把额头靠在我肩上，终于不再辩解。`,
 companyReply:`|我接过家属联络单。她一开始还站在旁边听，发现我们没有漏人，才慢慢坐远。
沈知夏|用药的别替我回答。其他的你们先处理。
|她定了闹钟，靠着椅背睡了。`,
 crisis:`|终端把当夜的二十七张病床全恢复了。监护仪上的曲线整齐得没有一次干扰。
|知夏向其中一张床走去，看见自己没救回的人睁开眼睛。
沈知夏|他还活着？
|电子交班单已经填完，只剩她签名。真实转运那六个人的床号却开始被覆盖。
|她手里的笔停在纸上，眼睛仍看着病人。
沈知夏|我知道对不上。你让我再看一下。`,
 good:'按留存的真实床号逐人核对，让她拒绝这份覆盖单。',repair:'断开虚拟交班，把还活着的人的记录先单独带走。',dream:'签下新交班单，让那些曲线继续跳动。',bad:'掀掉所有设备，拉着她离开病床。',
 release:`|我一床床念出真实编号。知夏跟着核对，最后在虚假交班单上写“拒绝接收”。
|幻影消失以前，她看了那个人最后一次。
沈知夏|对不起。那晚我没能救到你。
|她没有再填一个会把活人盖掉的签名。出去以后，我们扶着墙站了很久。`,
 repairText:`|连接断开，知夏蹲在地上，把还留着的纸质记录一张张捡起。
|有几项恢复不全，需要重新检查。她承认自己刚才差点签了，要求接班的人复核她手里的全部材料。
|没有人说她终于不用负责。她只是终于让别人一起查。`,
 later:`|知夏接受了独立复核，暂时不值夜班。第一晚她三点醒来，发现根本没人等她交班。
|早上她给自己煮了一颗过老的鸡蛋，发到群里，问是不是煮坏了。
|唐瑶回了七条语音。她一条条听完，又煮了一颗。`,
 confession:`沈知夏|下周那场电影，我买了两张。这次不选最早的。
我|片名记住了？
沈知夏|记住了。你再问，我就找别人。`,
 promise:`|我接过电影票，说到时见。她把休息日写进日历，没有在旁边注明“如有事可取消”。
|放下手机时，她主动握了握我的手。`,
 endings:{true:`|电影很难看，我们看了二十分钟就小声笑起来。知夏说早知道该选喜剧，我说现在差不多。
|散场以后手机响了一次，她先交代值班联系人，再把屏幕扣下。
沈知夏|走吧。今天不回去加班。
|她牵着我去吃迟了很久的一顿晚饭。`,normal:`|知夏仍在复核那批病历。休息日有时会被打断，她会提前告诉我，而不是让我在电影院外一直等。
|我也会说自己失望，不再只回答理解。
|我们把没看成的电影记在纸上，先从最上面那一场补。`,work:`|知夏重做了医院的交班表，所有更正都保留原记录。我帮她整理，不碰需要专业判断的项目。
|新来的医生嫌表太细，她把当年的空白页拿给他看。
|表再也没有一栏要求一个人承担所有夜班。`,part:`|临走前她给我一张附近医院的地址卡，没有给我塞一堆用不上的药。
沈知夏|不舒服就去看。别想着隔着电话让我猜。
|我说知道了。她等我走到闸机边，才挥手。`,dream:`|曲线一直跳动，二十七人再没发生异常。知夏继续值班，签名，交班，再值班。
|门外真正转运的人找不到自己的床号，来问，她只能按屏幕回答。
|系统说所有人都已经被治好了。`,rain:`|我断掉全部设备的时候，真实与虚假的记录还连在一起。知夏冲过去保护纸质病历，身影被一起卷入空白。
|留在门口的药箱还有温度。
|我喊她交班，没有人应。`}},
 xu:{bg:'street',prop:'paper',intro:`|蔚蓝把旧图纸折了八折，怎么都塞不进包。我说换个大的，她说图容易丢。
|最后她把图卷起来，用我的伞带绑住。
许蔚蓝|伞先借我。
我|那下雨呢？
|她看了一眼外面，雨一直没停。我们站着对视了两秒，她才把伞带解回来。`,
 one:`|设计单位让蔚蓝签补充说明，声称桥上的更改经过她确认。
许蔚蓝|我确认的是门的位置。他把承重点也挪了。
|她把自己的旧签名指给我看，就在整张图纸最下面，确实没有注明范围。
我|你那时候看过全图吗？
|她低头，过了一会儿才摇头。
许蔚蓝|我急着交稿。这里不能替我删掉。`,
 truth:'将原图、改图和她漏看的部分一起保存，逐项说明。',work:'先按实测结果标出禁行位置，让需要撤离的人能绕开。',
 truthReply:`|我们把两张图放在同一张桌上，没有把她的失误裁掉。蔚蓝写到漏检位置，用尺子划了一道很直的线。
许蔚蓝|我平时画得太快。这一行慢一点。
|她签下今天的日期，交出原件。`,
 workReply:`|蔚蓝按实测标出不能用的承重点，换掉那张漂亮但已经过时的路线图。
|有人嫌改得难看，她把轮椅推过去，让他试一遍。
许蔚蓝|能过去再说颜色。现在先走。`,
 ready:(s,t)=>t==='truth'?(f(s,'lived_map')||f(s,'bridge_measured')):(f(s,'crew_ready')||f(s,'back_stair')),
 two:`|蔚蓝趴在图纸上睡着，脸上印了一块蓝墨。醒来还想继续画，笔却拿倒了。
我|先去洗脸。
许蔚蓝|哪里？
|我指了指她的脸，她却认真问最近的洗手间在哪边。`,
 near:'陪她去洗掉蓝墨，替她保管一会儿图纸。',company:'组织另一组人复核路线，让她停下画图休息。',
 nearReply:`|我举着手机灯，让她看玻璃上的倒影。她越擦越大，最后两个人都笑起来。
许蔚蓝|别拍。
|我把相机页面关掉。她看见了，伸手来接图纸，却先碰了碰我的指尖。`,
 companyReply:`|我和其他人沿她标出的路线走了一遍。她留在桌边，等每个点真实传回结果。
|有一处画错，我们报回来，她没有找理由，说等下把图改掉。
|那天最后一张图，不是她一个人确认的。`,
 crisis:`|终端把那座没有建成的桥铺在眼前。桥头刻着蔚蓝的名字，曾经批评她的人都站在对面鼓掌。
|她踏上第一块桥板，现实中那条裂缝同时移到了她脚下。
许蔚蓝|这个版本，我明明退回过。
|图纸开始自动替她签名，承重点从错误位置移到看不见的地方。
|她只要承认完工，就能留下完整的桥；真正的裂缝会被从所有检查单上抹去。`,
 good:'拿出实测与原图对照，固定真正可用的退出路径。',repair:'标记整段禁行，放弃保留这座桥，先撤回地面。',dream:'确认完工，留下她最初想建成的桥。',bad:'跳过未核验的桥板，强行把她拽回。',
 release:`|我把真实测量值报给她。蔚蓝划掉自动签名，亲手标出裂缝和退回理由。
|追光下的桥一点点收回。她踩着我们核验过的那段，慢慢回到地面。
许蔚蓝|还是想知道建好会是什么样。
我|以后再画。
|她没有说好，先蹲下来收起真实的旧图。`,
 repairText:`|我们把整段标为禁行，桥和旧设计一起封存。蔚蓝退回地面，伸手按了按自己仍在发抖的膝盖。
|可用的路线得重新测。她把所有不确定的位置写下来，没有为了赶快结束而涂掉。`,
 later:`|蔚蓝的新委托很小，只改一处早餐店门槛。她量了轮距，又问了送货车的尺寸，老板嫌她问太多。
|完工那天，轮椅第一次不用人抬就进了门。老板给她加了一个蛋，她高兴得把照片发给所有人。`,
 confession:`许蔚蓝|阳台还有半边空着。我想放两张椅子。
我|为什么不是一张长的？
许蔚蓝|吵架的时候还能拉远。你觉得呢？`,
 promise:`|我说先买两张，她把最便宜的那款划掉，说坐久了腰疼。
|最后我们坐在店里试了半小时椅子。她把手放在我们中间，等我握住。`,
 endings:{true:`|阳台的两张椅子并排放了很久，第一次吵架时真被她拉开一小段。
|我们把话说完，她没立刻拉回来，晚上又悄悄把我的杯子放近。
|第二天风大，我挪过去替她压住图纸，她给我让了位置。`,normal:`|蔚蓝还在处理那座旧桥的责任，空下来的时候才接小项目。她会把不懂的地方拿给我看，也会承认这次自己没把握。
|我们先放了一张折叠桌，椅子等赚够钱再买。
|她没有为这张临时桌画一幅保证永远好看的效果图。`,work:`|我们组了一个很小的改造工作室。第一条要求是让使用者实际走一遍，不靠交付照片算完工。
|蔚蓝仍然爱画漂亮的图，只是现在每张旁边都附着难看的测量记录。
|我负责提醒她吃饭，她负责提醒我别拿咖啡压原稿。`,part:`|她给我画了一张新住处到车站的图，中间标了早餐店和一条容易积水的路。
许蔚蓝|我没亲自走过。到了你改一下，别照单全信。
|我走过以后把修改版寄回，她在空白处写，收到。`,dream:`|桥头的名字永远闪亮。蔚蓝走到哪里，都有人说这才是她真正该有的作品。
|没有轮椅走上过桥，也没有货车停过。图里只保留了不会暴露问题的人。
|她的尺子量不出一条通往桥外的路。`,rain:`|我跳向那块没有核验的桥板，裂缝正好在我们脚下合并。
|蔚蓝把图扔回安全地面，自己没能跟着过来。
|图上最醒目的，是她还没来得及画完的禁行线。`}},
 bai:{bg:'theater',prop:'coin',intro:`|露露把一枚硬币放到我耳后，又拿出来。
白露露|好，确定你没被换掉。上次那个会自动配合我惊讶。
我|那我现在补一个？
白露露|晚了，加钱。
|她笑着把硬币收好，弯腰检查门铰链。她会在每扇门前做这件事，一扇也没漏。`,
 one:`|旧演出录像停在弟弟进箱子的那一帧。露露把镜头推近，门上的拉扣有一道很浅的白线。
白露露|我那天觉得会露馅，把它贴住了。他在里面看不到出口。
|她以前说过设备故障。我看向她，她先开口。
白露露|故障是真的。我把提示藏起来，也是真的。
|她把用于遮挡的布条拆下来，放在手机旁。
|今晚还有人在这条通道里等待，她问先把什么公开。`,
 truth:'保留她遮掉出口的记录，让所有演员知道真实原因。',work:'先拆掉隐藏出口的布景，逐个试内侧开门。',
 truthReply:`|露露录了一段说明，手里没有道具。她说错一个字，停下来纠正，没把整段删掉重录。
白露露|这个位置我贴过。以后谁叫你们再贴，给他看这段。
|她发给演出群，没等点赞，先去拆第二扇门。`,
 workReply:`|我们把遮布全部移走，让每个人从里面试着开门。第一位试了三次，还是摸不到。
|露露把把手的位置重新调低，没有嫌那个人笨。
白露露|摸得到才算。我知道它在哪，不算。`,
 ready:(s,t)=>t==='truth'?(f(s,'learned_exit')||f(s,'paper_cup')):(f(s,'crew')||f(s,'crew_ready')),
 two:`|露露试着用受潮的牌变一个戏法，抽出来的两张全黏在一起。
白露露|今天特别节目，一张变两张。
|我笑了，她也笑，笑完把牌扔进盒里，不再试第二遍。
白露露|我不逗你们的时候，你会不会觉得我挺没意思？`,
 near:'把牌盒放下，告诉她可以什么也不表演。',company:'叫来其他人分担检查，不再让她一个人撑场。',
 nearReply:`|我把那枚硬币还给她。她握住，没再变走。
我|你安静的时候也没赶我走啊。
|露露坐到我旁边，肩挨着肩，过了好一会儿才说，原来你会说这种话。
|这次她没接一个笑话把它带过去。`,
 companyReply:`|大家各查一扇门，露露终于不用边确认边讲笑话。她坐在箱子上吃半块饼干。
白露露|我宣布本场没主持。自己互相鼓掌吧。
|她说完就真的闭了麦。`,
 crisis:`|一只儿童手套出现在道具箱旁。里面有人叫姐姐，声音和录像里一模一样。
|露露伸手去拉门，发现把手已经被装到了错误一侧。
白露露|这次我看见了。给我再开一次。
|演出单上，她的名字代替了内侧的紧急出口。签下去，弟弟的画面就会留下，门也会永远锁着。
|她仍握着那枚硬币，边缘把手心压出了红印。`,
 good:'按实际测试过的内侧出口打开门，让她自己取消演出。',repair:'拆掉整套布景，让所有门都失效，放弃那段完整影像。',dream:'签下新的演出单，让弟弟再谢幕一次。',bad:'从外面猛砸箱门，强行把她和手套拉出来。',
 release:`|我把内侧拉扣交到她手里，没有替她按。露露看了很久，终于拉下去。
|门开了，里面的声音也停了。她捡起手套，把它和未签名的演出单分开放。
白露露|这场结束了。
|她坐到台阶上，没有鞠躬，也没有向谁要掌声。`,
 repairText:`|整套布景被卸掉，影像断在弟弟尚未回头的时候。
|露露捡起散落的螺丝，让我别把它们当垃圾扫走。我们没能留下完整片段，至少再没有一扇门靠她的名字锁住。
|她提着空道具盒，自己走出了后台。`,
 later:`|露露在小剧场做了一场不卖票的安全演示。第一步就把机关摊给观众看。
|有人说没悬念，她笑着让他上来试出口。那人卡住了两次，下来时没再抱怨。
|她收场以后坐在空椅子上，等我帮她关灯。`,
 confession:`白露露|周六空着吗？不排练，不演出，就找个地方坐。
我|你确定坐得住？
白露露|你陪我，我试试。`,
 promise:`|我收下她那枚老硬币。她先张口要变一个什么，想了想，改成直接牵我的手。
白露露|这个不收道具费。`,
 endings:{true:`|我们在河边坐了一下午，她只变了一次硬币，还被我看穿了。
|露露承认以后，笑得比成功时还响。后来什么也没变，她把头靠在我肩上，看对面收摊。
|回去前，她自己站起来说走吧，没有等一声散场铃。`,normal:`|有时露露还会用笑话躲开难谈的事。我没逼她马上回答，也没每次都跟着把话题笑过去。
|我们一起整理剩下的录像，停在不想看的地方就停。
|她慢慢肯把“不想说”直接说出来。`,work:`|小剧场重新开放，每场开始前先演示出口。露露负责表演，我负责核对观众和工作人员名单。
|节目里仍有惊喜，紧急拉扣却永远露在外面。
|她给它涂了亮黄色，谁说破坏美感也没用。`,part:`|她没有在送别时变出什么，只把一枚普通地铁币放进我手里。
白露露|用得上就用。别当纪念品供着。
|后来我真的用掉了，告诉她，她回了一句很好，又发来新的演出时间。`,dream:`|弟弟终于按时谢幕。露露在每一场结束后抱住他，他再走进箱子，等下一次表演。
|观众永远满座。后台的出口始终朝着错误的一边。
|她问还有几场，没人告诉她。`,rain:`|箱门被我砸开，承担出口位置的那段记录也跟着断了。
|露露把手套向我递来，自己的手却停在箱内。
|地上那枚硬币转了很久，没有再被谁接住。`}},
 cheng:{bg:'archive',prop:'letter',intro:`|雨声把文件夹里的纸排好，忽然停在一张停车罚单上。
程雨声|这个不是证据。
我|你也违停？
程雨声|我也会来不及找车位。
|她把罚单收进自己口袋，其他人的赔偿申请放回最上面。她不再把自己的失误夹在最不显眼的位置。`,
 one:`|何启年发来一份和解。只要雨声撤回对收件流程的质疑，就能保住她的执业资格。
|附件是她当年亲签的驳回理由，一字不漏。
程雨声|他留得比我全。
我|有哪一项是假的？
程雨声|没有。假的是他写“当事人已无异议”。你当时已经反对过了。
|她把原协议放到我面前，问我要不要另找代理人。`,
 truth:'让她补录我当年的异议，交给独立代理人，而不是继续替我决定。',work:'先修复每一份记录的申诉渠道，由她承担自己签过的部分。',
 truthReply:`|我选了另一个代理人。雨声把全部材料移交，包括会让她被追责的附件。
程雨声|我只作为相关证人，不再同时代表你。
|她说完，第一次像真的卸下了一个不该由她兼任的身份。`,
 workReply:`|雨声把申诉、收件、答复分成三份，由不同的人接手。每一份都留当事人的副本。
|她去补自己签过的记录，没有要求大家先签谅解。
程雨声|补救和原谅两回事。你们先用得上再说。`,
 ready:(s,t)=>t==='truth'?(f(s,'withdrawal_proof')||f(s,'postal_proof')):(f(s,'dual_control')||f(s,'owned_fault')),
 two:`|雨声在台阶上脱下高跟鞋，脚后跟磨破了。手机还贴在耳边，嘴上说着请对方继续。
|通话终于结束，她把鞋提起来，叹气。
程雨声|我应该穿运动鞋。
我|不是早知道要跑一天？
程雨声|以为至少能坐着吵。`,
 near:'陪她慢慢走一段，告诉她我还没说完的气话。',company:'叫其他人接下联络，让她处理自己的伤和责任。',
 nearReply:`|我说起她驳回申请的事，语气不太好。雨声没打断，等我说完，才纠正其中一个记错的时间。
程雨声|这部分你骂错了。其他的没有。
|我忍不住笑，她也笑，伸手挽住我，脚下仍走得很慢。`,
 companyReply:`|我把几通联络交给大家。雨声坐下贴胶布，重新读自己的责任说明，没有再替别人的材料加班。
|她提出下一次由其他人主持复核。大家同意，她把自己的椅子移出了主持位。`,
 crisis:`|终端打印出十几封谅解书，每一封都说雨声没有做错。
|最后一页要求烧掉旧原件，以免继续伤害“已经和解”的关系。
程雨声|连你的字都像。
|她拿着写有我签名的那张，眼睛发红。得到这句话，她等过很久。
|纸边起了小火，原始异议书就在下层。两份材料的时间对不上，新的谅解反而早了一分钟。`,
 good:'用独立保存的异议和签收时间核对，拒绝代写的谅解。',repair:'先把原件抢救封存，谅解书等离开以后逐人核实。',dream:'收下这些谅解，让过去的责任在这里结束。',bad:'一把扯走燃烧的所有材料，强行毁掉这次复核。',
 release:`|雨声逐一核对时间，把伪造的谅解单独订起。她最后看了“我”写的那封，放进证物袋。
程雨声|这不是你写的。我还是得等你自己说。
|我没有当场给她一句新的。她接受了，自己按下拒绝覆盖。`,
 repairText:`|我把原件移进防火盒，雨声盖紧，没有再看那几张漂亮的谅解。
|我们暂时分不清每一份是谁写的，不能直接下结论。她联系独立代理人，等对方来处理。
|那晚她没有得到免责，也没有丢掉继续补救的材料。`,
 later:`|雨声出席自己的听证，穿的是运动鞋。她把代理席留给别人，自己坐在被询问的位置。
|散场后她站在门口，很久没动。我递过去一瓶水，她拧开喝了半瓶。
程雨声|比我想的难受。也比一直躲着好一点。`,
 confession:`程雨声|周末有空吗？不看文件，不顺便见当事人。
我|你能忍住？
程雨声|我把手机交给别人一下午。你监督。`,
 promise:`|我答应了，她拿出日历，写下餐厅名字，没附带任何工作。
|后来她又给我发了一句：不是请你吃饭抵掉过去。只是我想见你。
|我回了一个好。`,
 endings:{true:`|我们第一次约会真的没谈案子，直到找不到停车位，雨声自己提起那张罚单。
|我笑她，她说今天不犯同一个错，宁可多走两条街。
|她把手递给我。过去还在处理，眼前这顿饭没有被拿去抵账。`,normal:`|雨声继续接受复核，我们的关系也慢慢往前走。有时我仍会想起那张被驳回的纸，她听到不会再急着证明自己已经补救。
|我们说不清哪天才算完全放下，就先把每次约好的见面做到。`,work:`|雨声不再代理我的部分，把它交给独立律师。我在她的团队做记录整理，谁签收谁留名。
|每次看到“视为无异议”，她都会拿笔圈出来。
|我提醒她喝水，她提醒我给每个当事人留副本。`,part:`|她把我的全部资料交还，没有藏一张当作下次见面的理由。
程雨声|这是你的。以后需要我作证，联系这个号码。
|我收下文件，我们在路口分别。她没有把离开解释成我原谅或不原谅的证明。`,dream:`|所有人都写了谅解，包括从未到场的人。雨声终于不用再回答旧问题。
|新的协议沿用那句“视为无异议”。下一位申请人来问，她翻遍档案，找不到原来的反对记录。
|纸都烧干净了。`,rain:`|材料被一把扯碎，维持她身份的签收记录也在其中。雨声还想护住当事人副本，手却穿过了纸。
|桌上只留下那封不是我写的谅解。
|我再也没有机会当面告诉她自己的答案。`}},
 ye:{bg:'roof',prop:'record',intro:`|初遥背着设备从门口侧身挤过去，卡了两次。
叶初遥|别推我，推箱子。
|箱子过去以后，她扶着门框喘气，还不忘问哪边插头被碰了。
我|你比行李还操心。
叶初遥|行李不会自己开无线上传。
|她从兜里掏出一张咬过角的卡，先让我摸缺口，再放回盒子。`,
 one:`|初遥收到一份“信号修复成功”。录音里，她母亲终于把没说完的晚安说完了。
|修复要求把未经处理的原始数据删掉，以免再次损坏。
叶初遥|这也太急了。好歹让我先骗自己三分钟吧。
|她笑了一下，没笑下去。复制窗口已经打开，目标正是咬过角的那张卡。
我|你准备怎么留？
|她把鼠标推给我，手还放在桌边，等着自己按最后一步。`,
 truth:'同时保留原轨和修复稿，把每一处补写单独标记。',work:'把回传分给两个独立接收点，不再只由她保存。',
 truthReply:`|我们把两份分开存，补出来的半句标为未经证实。初遥一边标一边骂修复程序，骂着骂着又没声音了。
叶初遥|原来的就到这里。我知道。
|她把原始卡放进盒子，没有按删除。`,
 workReply:`|初遥把收听和确认分给两个人，自己不再同时做两项。她问了三次对方收到没有，最后才放下对讲机。
叶初遥|两个人都错也比我一个人骗自己好查。
|她把两份回执订在卡盒上。`,
 ready:(s,t)=>t==='truth'?(f(s,'signal_raw')||f(s,'after_silence')):(f(s,'signal_key')||f(s,'full_copy')),
 two:`|初遥在设备箱上睡着，脸压着一条散热孔。我把她叫醒，她先问有没有过热。
我|你脸热。
叶初遥|那说明散热不错。
|她坐直，盯着我看了两秒才想起刚才在干什么。`,
 near:'拿走她压着的箱子，陪她在没有机器声的地方坐一会儿。',company:'把接收值守排给其他人，让她不用盯下一轮信号。',
 nearReply:`|我们坐到走廊末端。初遥忍了三分钟，才问我会不会觉得她满嘴都是设备。
我|会。但你现在也没问我电压多少。
|她笑起来，把冷得发红的手塞到我掌心。
叶初遥|那你替我暖一下。这个不用校准。`,
 companyReply:`|我把值守排好，初遥交出最后一个备用接头。她走了两步，又回来确认一次。
|我们当着她面收到下一轮，她才终于放心去睡。
叶初遥|有事叫，没事别发一堆“收到”。手机也得睡。`,
 crisis:`|接收机突然只剩母亲的声音，没有雨，没有延迟。
|那段说了一半的晚安，后面接着一整段她从没听过的叮嘱。
|屏幕提示存储已满，要覆盖原始卡才能继续接收。
叶初遥|真的不能再等一分钟？
|她当然知道时间不是问题。她把咬过角的卡攥紧，另一只手还停在确认键上。
|机器在等待她承认补写的声音就是真实记录。`,
 good:'核对独立保存的原轨，停止覆盖，只把新声轨标成未知来源。',repair:'拔下原始卡，放弃这次完整接收，保住已经确定的部分。',dream:'允许覆盖，听完母亲没说完的那句话。',bad:'砸开机器，把正在写入的全部线路同时扯断。',
 release:`|我把第二个接收点的记录交给她。只有这台机器多出一段完整告别。
|初遥按下取消，把新轨标成未知来源。她没有删，原来的也没删。
叶初遥|等我哪天能听，再查它从哪来的。
|她关机以后，把耳朵贴在安静的机壳上，靠了一会儿。`,
 repairText:`|卡拔出来，最后那句晚安跟着断了。初遥望着熄掉的窗口，没有立刻重新插回去。
|我们没能完整备份新轨，真假也无从核对。她把这次标成接收失败，原始卡收回盒子。
叶初遥|先回去吧。今晚不再试了。`,
 later:`|初遥给接收设备设了夜间静默，第一晚自己没忍住去开，又关上。
|早上她睡过头，唐瑶在群里问天线工程师是不是终于不用靠光合作用。
|她回了个骂人的表情，下来吃了两碗。`,
 confession:`叶初遥|想不想去海边？真海边，没有设备那种。
我|天线也不带？
叶初遥|你检查包。最多带个充电器。`,
 promise:`|我订好车票，初遥盯着确认页看了很久。
叶初遥|这次不是用来证明谁还在，对吧？
我|用来坐车。
|她笑了，把票截图设成手机锁屏。`,
 endings:{true:`|到了海边，初遥真没带设备。她看见远处的天线想讲两句，自己停下，说以后再讲。
|我们买了两杯冰饮，她喝一口嫌冷，全推给我，自己抓着我的手取暖。
|回程车上她睡着了，手机没有响。`,normal:`|初遥还会在夜里醒来检查录音。我有时陪她听，有时告诉她自己困了，明天再说。
|她慢慢习惯先发消息，而不是一有信号就要求所有人同时醒着。
|海边的票改签过一次，后来终于用掉。`,work:`|新的接收站有公开值守表，原始与修复数据分开存。初遥负责维护，不再单独批准覆盖。
|有人抱怨手续多，她让他看那张咬过角的卡，讲清差别，再问他还愿不愿意只留一份。`,part:`|我搬走后，初遥把设备拆回了自己的房间，没有留一个只为等我回来的频道。
|我们偶尔互发收听到的有趣声音。她发的文件不再总带着“立刻听”。
|有空听，听了再回。`,dream:`|母亲的晚安终于完整。每晚都在同一秒传来，连初遥没问出口的问题也答得恰到好处。
|原始卡被覆盖，七秒延迟消失了。后来她想查那段话出自哪里，机器只重复：你不是已经听见了吗？`,rain:`|写入线路同时断开，设备把保存者也当成未完成的记录清理。初遥的手还护着卡槽，身体已经失去边缘。
|我抓到那张咬过角的卡。里面的半句晚安还在，她却再也没能亲自按一次播放。`}}
 };
 const preparation={
 lin:['我抽出另存的那份底片，放在承诺还原一切的照片旁。日期不一样。','我只拿得出重新封过的一份。晚月伸手要碰相纸，我先扣住盒盖。'],

 shen:['知夏把此前留下的交接记录递给另一位医生，要求他逐项签收。','记录上仍只有知夏的名字。这一轮不能再让她一个人扛着所有判断。'],

 function render(force=false){if(!state)return;const n=node();$('app').dataset.mode=state.mode;const currentSpeaker=n.lines[state.line]?.speaker;const stage=n.relaySpeaker&&names[currentSpeaker]?{...n,cast:[{id:names[currentSpeaker],variant:10}]}:n;visual(stage);remember(stage);CINEMA.update(stage,state,settings);setModeButtons();

 function openSaves(mode='save'){const slots=readStored('slots',Array(6).fill(null));let html=`<p class="muted">${mode==='save'?'把此刻留在一张书签里。':'从那一页继续。已读回忆不会被覆盖。'}</p><div class="save-grid">`;if(mode==='load'){const a=readStored('auto',null);html+=`<button class="save-slot" data-slot="auto" ${!a?'disabled':''}>${slotMarkup('auto',a)}</button>`;}for(let i=0;i<6;i++)html+=`<button class="save-slot" data-slot="${i}" ${mode==='load'&&!slots[i]?'disabled':''}>${slotMarkup(i,slots[i])}</button>`;html+=`</div><div class="utility-row">${state?'<button id="exportSave">导出当前书签</button>':''}<button id="importSave">导入书签</button></div><p class="muted">${persistentStorage?'书签保存在此浏览器。换设备或移动文件前，可导出备份。':'此浏览器禁用了持久化存储。临时书签仅保留到本页关闭，请导出备份。'}</p>`;
 openModal(mode,mode==='save'?'留下书签':'打开书签',html,()=>{document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{let i=b.dataset.slot;if(mode==='load'){resume(i==='auto'?readStored('auto',null):slots[+i]);return;}if(!state){toast('先翻开故事，再留下书签。');return;}const save=()=>{updateClock();state.savedAt=Date.now();slots[+i]=CORE.clone(state);if(writeStored('slots',slots))toast(persistentStorage?'这一页，留好了。':'已留下临时书签。关闭页面前，请导出备份。');storeMeta();openSaves('save');};if(slots[+i])confirmBox('替换这张书签？','旧书签会被当前这一页覆盖。','替换',save);else save();});$('exportSave')?.addEventListener('click',exportSave);$('importSave').onclick=()=>$('importInput').click();});}
 function exportSave(){if(!state)return;updateClock();state.savedAt=Date.now();storeMeta();awards.flush();const payload={format:'before-the-rain',version:6,state,meta,settings,trophies:awards.dump()};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='雨停之前-书签-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('书签已导出。');}
 async function importFile(file){if(!file)return;if(file.size>5*1024*1024){toast('书签过大，本作只接受 5 MB 以内的 JSON。');return;}try{const p=JSON.parse(await file.text());
   if(p.format==='before-the-rain'&&[4,5].includes(p.version)&&Array.isArray(p.meta?.read)){
    const oldRead=p.meta.read.slice(0,50000).filter(k=>typeof k==='string'&&k.length<160&&/^[\w@%:.-]+$/.test(k));
    confirmBox('只带入旧版已读标记？','未改动的段落可以使用已读快进，新写的文字仍会停下来。不会导入旧剧情状态、旧结局或旧奖杯，也不替换当前第六版进度。','带入已读标记',()=>{for(const k of oldRead)readSet.add(k);storeMeta();closeModal(false);if(state){currentKey='';render(true);}toast('已读标记已带入。改写段落与所有选择仍需重新阅读。');});return;
   }
   if(p.format!=='before-the-rain'||p.version!==6)throw new Error('本篇重写了剧情状态，请使用第六版书签；旧周目请保留原版文件继续。');const verified=CORE.validate(p.state);
   confirmBox('从这张书签继续？','当前进度会被替换，已有手动书签和回忆仍会保留。','打开',()=>{
    if(p.meta&&typeof p.meta==='object'){for(const k of Array.isArray(p.meta.read)?p.meta.read.slice(0,50000):[])if(typeof k==='string'&&k.length<160)readSet.add(k);for(const k of Array.isArray(p.meta.met)?p.meta.met:[])if(NOVEL.ids.includes(k))metSet.add(k);for(const k of Array.isArray(p.meta.art)?p.meta.art.slice(0,120):[])if(/^\w+:\d+$/.test(k)&&NOVEL.ids.includes(k.split(':')[0])&&+k.split(':')[1]<12)artSet.add(k);for(const [k,v]of Object.entries(p.meta.endings||{}))if(NOVEL.ENDINGS.some(e=>e.id===k))meta.endings[k]=+v||Date.now();for(const k of Array.isArray(p.meta.paths)?p.meta.paths:[])if(['a','b','c'].includes(k)&&!meta.paths.includes(k))meta.paths.push(k);storeMeta();}
    meta.endingPages={...(meta.endingPages||{}),...(p.meta?.endingPages||{})};if(p.trophies)awards.merge(p.trophies,{silent:true});resume(verified);toast('回到这一页。奖杯与回忆已保留。');});
  }catch(e){toast('无法导入：'+e.message);} }
 function openSettings(){const toggle=(key,label,small)=>`<div class="setting-row"><div><label>${label}</label>${small?`<small>${small}</small>`:''}</div><button class="setting-toggle" data-toggle="${key}" aria-pressed="${!!settings[key]}">${settings[key]?'开':'关'}</button></div>`;
 const voices=SOUND.voices();const html=toggle('sound','声音','雨声、房间氛围、原创程序化音乐与音效。')+toggle('voice','对白朗读',voices.length?'使用此设备已安装的中文语音。':'此设备暂未提供中文语音；文字、音乐照常运行。')+`<div class="setting-row"><div><label for="volumeSetting">音量</label></div><input type="range" id="volumeSetting" min="0" max="100" value="${settings.volume*100}"></div><div class="setting-row"><div><label for="speedSetting">文字展开</label><small>移到最左侧，立即显示整句。</small></div><input type="range" id="speedSetting" min="0" max="65" step="1" value="${settings.typeMs}"></div><div class="setting-row"><div><label for="delaySetting">自动阅读留白</label><small>自动仍会停在每一次决定之前。</small></div><input type="range" id="delaySetting" min="800" max="5000" step="100" value="${settings.autoDelay}"></div>`+toggle('cinema','镜头演出','近景、景深与道具特写；关闭不影响剧情。')+toggle('trophyNotices','奖杯轻提示','不遮对白；关闭后仍正常记录奖杯。')+toggle('trophySound','奖杯音效','只影响奖杯提示声。')+toggle('reduce','减少动态效果','停止雨丝与淡入；文字直接显示。')+`<p class="keys">空格 / 回车：继续　A：自动　L：回看　S：存档<br>Esc：暂停　H：隐去文字　T：奖杯　J：夹页　1–5：当前选项<br>自动阅读默认关闭；快进只经过已经读过的文字。</p>`;
 openModal('settings','把故事读得舒服一点',html,()=>{document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const k=b.dataset.toggle;settings[k]=!settings[k];if(k==='sound'&&settings.sound)startAudio();saveSettings();openSettings();});$('volumeSetting').oninput=e=>{settings.volume=+e.target.value/100;saveSettings();};$('speedSetting').oninput=e=>{settings.typeMs=+e.target.value;saveSettings();};$('delaySetting').oninput=e=>{settings.autoDelay=+e.target.value;saveSettings();};});}
 function memoryNav(tab){return `<nav class="subnav" aria-label="回忆类别"><button data-memory="people" class="${tab==='people'?'active':''}">相册</button><button data-memory="endings" class="${tab==='endings'?'active':''}">读过的结尾</button>${state?'<button data-memory="flow">走过的路</button>':''}</nav>`;}
 function bindMemoryNav(){document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>b.dataset.memory==='flow'?openFlow():openMemory(b.dataset.memory));}
 function openMemory(tab='people'){if(tab==='people'){let html=memoryNav(tab)+`<div class="gallery-grid">`+ART.people.map(p=>metSet.has(p.id)?`<button class="person-card" data-person-card="${p.id}"><div class="thumb">${ART.portrait(p.id,0,'card'+p.id)}</div><span class="person-name">${p.name}</span></button>`:`<div class="person-card locked"><div class="thumb"></div><span class="person-name">尚未相遇</span></div>`).join('')+'</div>';if(!metSet.size)html+='<p class="muted">先走进那间照相馆。</p>';openModal('memory','回忆里的人',html,()=>{bindMemoryNav();document.querySelectorAll('[data-person-card]').forEach(b=>b.onclick=()=>openPortrait(b.dataset.personCard));});}
 else{const entries=NOVEL.ENDINGS;let html=memoryNav('endings')+'<div class="ending-list">'+entries.map(e=>meta.endings[e.id]?`<button class="ending-memory" data-ending="${e.id}">${esc(e.title)}</button>`:'<div class="ending-memory locked">还没有走到的后来</div>').join('')+'</div>';openModal('memory','那些后来',html,()=>{bindMemoryNav();document.querySelectorAll('[data-ending]').forEach(b=>b.onclick=()=>endingMemory(b.dataset.ending));});}}
 function openPortrait(id,variant){const p=ART.people.find(p=>p.id===id);if(!p||!metSet.has(id))return;const unlocked=Array.from({length:12},(_,i)=>i).filter(i=>artSet.has(id+':'+i)||Math.floor(i/3)===0||meta.endings[id+'_true']||meta.endings[id+'_normal']);if(!unlocked.includes(variant))variant=unlocked[0]||0;
 const labels=['雨中的她','日常的她','同行的她','以后的她'];const html=memoryNav('people')+`<div class="portrait-view"><div class="portrait-large">${ART.portrait(id,variant,'gallery')}</div><div class="portrait-info"><h3>${p.name}</h3><p>${p.age} 岁 · ${esc(p.job)}</p><p>${labels[Math.floor(variant/3)]}</p><div class="variant-grid">${Array.from({length:12},(_,i)=>`<button data-variant="${i}" ${!unlocked.includes(i)?'disabled':''} class="${i===variant?'selected':''}" aria-label="${labels[Math.floor(i/3)]}，第 ${i%3+1} 种神情">${unlocked.includes(i)?String(i+1).padStart(2,'0'):'—'}</button>`).join('')}</div><p class="muted">相册留下见过的衣着与神情，不提前替她介绍秘密。</p><div class="utility-row"><button id="backToPeople">回到相册</button></div></div></div>`;
 openModal('portrait',p.name,html,()=>{bindMemoryNav();document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>openPortrait(id,+b.dataset.variant));$('backToPeople').onclick=()=>openMemory();});}
 function endingMemory(id){const e=NOVEL.ENDINGS.find(e=>e.id===id);if(!e||!meta.endings[id])return;const n=NOVEL.nodes[e.node],rows=meta.endingPages?.[id]||[];openModal('ending-memory',n.title,(rows.length?rows.map(l=>`<div class="log-entry"><span class="log-name">${esc(l.speaker==='我'?'沈渡':l.speaker)}</span><p>${esc(l.text)}</p></div>`).join(''):'<p class="muted">这枚结局记录没有附带当时的文字快照。再次读到以后会补全，不会替你编造另一条城市结局。</p>')+'<div class="utility-row"><button id="backEndings">回到读过的结尾</button></div>',()=>$('backEndings').onclick=()=>openMemory('endings'));}
 function openFlow(){if(!state){toast('还没有走过的路。');return;}let html='<p class="muted">这里只记得你真正走过的路，不画出尚未发生的事。</p><div class="flow-list">';for(let i=0;i<state.decisions.length;i++){let d=state.decisions[i];let cp=state.checkpoints.findIndex(c=>c.node===d.node&&c.decisions.length===i);html+=`<div class="flow-item"><h3>${esc(d.title)}</h3><p>${esc(d.text)}</p>${cp>=0?`<button data-rewind="${cp}">回到这个决定之前</button>`:''}</div>`;}html+='</div>';if(!state.decisions.length)html+='<p class="muted">先把眼前这一页读完。</p>';openModal('flow','走过的路',html,()=>{document.querySelectorAll('[data-rewind]').forEach(b=>b.onclick=()=>{const ix=+b.dataset.rewind;confirmBox('回到那时？','这一张书签会回到那个决定之前。已经读过的回忆仍然保留。','回去',()=>rewindTo(ix));});});}
 function toggleAuto(){if(!state||state.mode!=='text'||modalName)return;auto=!auto;skip=false;setModeButtons();if(auto&&typing){}else scheduleNext();}
 function toggleSkip(){if(!state||state.mode!=='text'||modalName)return;if(!wasRead){toast('这一页还没有读过。');return;}skip=!skip;auto=false;setModeButtons();if(skip)completeText(true);else clearTimeout(autoTimer);scheduleNext();}
 function hideDialogue(){if(!state||state.mode!=='text'||modalName)return;hiddenText=!hiddenText;clearTimeout(autoTimer);$('reading').hidden=hiddenText;$('restoreText').hidden=!hiddenText;if(hiddenText){auto=false;skip=false;setModeButtons();SOUND.cancelSpeech();}else{completeText(true);}}
 $('newGame').onclick=()=>{if($('app').dataset.screen==='title'&&readStored('auto',null)){confirmBox('重新翻开第一页？','自动书签会从新故事开始，手动书签与回忆仍会保留。','从头开始',()=>startGame());}else startGame();};
 $('continueGame').onclick=()=>{const s=readStored('auto',null);if(s)resume(s);};$('memoryBtn').onclick=()=>openMemory();$('titleSettings').onclick=openSettings;$('afterwordBtn').onclick=()=>startGame('afterword_small');$('tableBtn').onclick=()=>startGame('afterword_gate');
 $('lineArea').onclick=stepStory;$('storyScreen').addEventListener('click',e=>{if(e.target===$('storyScreen'))stepStory();});$('leaveScene').onclick=()=>{CORE.leave(state);currentKey='';render(true);};$('pauseBtn').onclick=menu;$('quickAudio').onclick=()=>{settings.sound=!settings.sound;startAudio();saveSettings();};
 $('logBtn').onclick=openLog;$('autoBtn').onclick=toggleAuto;$('skipBtn').onclick=toggleSkip;$('saveBtn').onclick=()=>openSaves('save');$('loadBtn').onclick=()=>openSaves('load');$('hideTextBtn').onclick=hideDialogue;$('restoreText').onclick=hideDialogue;
 $('closeModal').onclick=()=>closeModal();$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});$('importInput').onchange=e=>{const f=e.target.files[0];e.target.value='';importFile(f);};
 document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLSelectElement)return;
   if(modalName){if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const focusable=[...$('modal').querySelectorAll('button:not(:disabled),input,[tabindex="0"]')].filter(x=>x.offsetParent!==null);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}
   if($('app').dataset.screen!=='story')return;if(e.key==='Escape'){e.preventDefault();menu();return;}
   const key=e.key.toLowerCase();if(e.key===' '||e.key==='Enter'){if(e.target instanceof HTMLButtonElement)return;e.preventDefault();if(hiddenText)hideDialogue();else stepStory();}
   else if(key==='a'){e.preventDefault();toggleAuto();}else if(key==='l'){e.preventDefault();openLog();}else if(key==='j'){e.preventDefault();openConsequences();}else if(key==='s'){e.preventDefault();openSaves('save');}else if(key==='t'){e.preventDefault();trophyBook.open();}else if(key==='h'){e.preventDefault();hideDialogue();}else if(/^[1-5]$/.test(key)&&state.mode==='choice'){e.preventDefault();const ix=+key-1;if(CORE.choices(state)[ix])choose(ix);}
 });
 document.addEventListener('visibilitychange',()=>{if(document.hidden){saveAuto();clearTimeout(typeTimer);clearTimeout(autoTimer);SOUND.visibility(true);auto=false;skip=false;setModeButtons();}else{sessionTick=performance.now();SOUND.visibility(false);if(state?.mode==='text'&&!modalName){completeText(true);}}});
 window.addEventListener('beforeunload',saveAuto);window.addEventListener('resize',()=>{if(state?.mode==='explore'&&!modalName)renderExplore(node());if(state?.mode==='choice'&&!modalName)fitChoices();});
 // Small testable surface: rendering still runs the production state machine and same save validator.
 window.RAIN={get state(){return state?CORE.clone(state):null;},get meta(){return {...meta,read:[...readSet],met:[...metSet],art:[...artSet]};},get settings(){return {...settings};},get status(){return {typing,auto,skip,modal:modalName,screen:$('app').dataset.screen,storage:persistentStorage?'persistent':'temporary',voice:SOUND.info()};},advance(){completeText(true);stepStory();},choose,look(key){if(state?.mode==='explore'){CORE.inspect(state,key);currentKey='';render(true);}},leave(){if(state?.mode==='explore'){CORE.leave(state);currentKey='';render(true);}},resume,rewind:rewindTo,start:startGame,exportSave,importFile,openFlow,openPortrait,openMemory,openConsequences,setReadingSpeed(ms){settings.typeMs=Math.max(0,Math.min(65,ms));settings.voice=false;saveSettings();},manifest(){return {version:6,trophies:60,storyVersion:6,storyNodes:Object.keys(NOVEL.nodes).length,characters:ART.people.length,portraits:120,encounters:ECHO_LIB.registry.length,endings:NOVEL.ENDINGS.length};}};

 function exportTrophies(){awards.flush();const payload={format:'before-the-rain-trophies',version:6,trophies:awards.dump(),exportedAt:Date.now()};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='雨停之前-奖杯备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('回响已备份。故事书签请在存档页另行导出。');}
 async function importTrophies(file){if(!file)return;try{if(file.size>5*1024*1024)throw Error('请使用 5 MB 以内的 JSON 备份');const p=JSON.parse(await file.text());if(p.format!=='before-the-rain-trophies'||p.version!==6||!p.trophies||p.trophies.version!==6||!p.trophies.evidence)throw Error('只能导入第六版奖杯；第五版收藏保留在原文件中');confirmBox('合并这份回响？','只合并奖杯和探索记录，不替换当前剧情书签。','合并',()=>{awards.merge(p.trophies,{silent:true});trophyBook.open();toast('两份回响，已经放在一起。');});}catch(e){toast('无法导入：'+e.message);}}
 trophyBook=TROPHY_VIEW.create({ledger:awards,openModal,toast,settings:()=>settings,onBackup:exportTrophies,onImport:()=>$('trophyImportInput').click()});
 $('causeBtn').onclick=()=>openConsequences();
 $('titleTrophies').onclick=()=>trophyBook.open();$('trophyBtn').onclick=()=>trophyBook.open();

 let previousAuto=null;try{const oldAuto=readStored('auto',null);if(oldAuto)previousAuto=CORE.validate(oldAuto);}catch{}

 const previousSlots=readStored('slots',[]);for(const old of Array.isArray(previousSlots)?previousSlots:[])if(old){try{const v=CORE.validate(old);awards.observe(v,awardMeta(),{migrate:true,silent:true,restored:true});}catch{}}
 window.addEventListener('storage',e=>{if(e.key===KEY+'trophies'&&e.newValue){try{awards.merge(JSON.parse(e.newValue),{silent:true});}catch{}}});
 window.addEventListener('resize',()=>{if(state&&$('app').dataset.screen==='story')CINEMA.update(node(),state,settings);});
 window.RAIN.awards={get profile(){return awards.dump();},get summary(){return awards.summary();},open:()=>trophyBook.open(),detail:id=>trophyBook.detail(id),export:exportTrophies,importFile:importTrophies,get pending(){return trophyBook.pending;}};
 applySettings();showTitle();

})();
